name: Tailwind CSS

# Guards against drift: rebuilds the committed assets/css/tailwind.css and fails
# if it differs from what's in the repo. GitHub Pages still builds the site with
# its native Jekyll pipeline using the committed CSS — this is a check, not a deploy.
on:
  push:
    paths:
      - '**/*.html'
      - '**/*.md'
      - 'assets/js/**'
      - 'assets/css/_tailwind.css'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tailwind.yml'
  pull_request:

jobs:
  verify-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:css
      - name: Fail if committed CSS is out of date
        run: |
          if ! git diff --quiet -- assets/css/tailwind.css; then
            echo "::error::assets/css/tailwind.css is stale. Run 'npm run build:css' and commit the result."
            git diff -- assets/css/tailwind.css
            exit 1
          fi
