title: "PoolFlow — Pool Service Management App"
description: "The all-in-one iOS app for pool service technicians. Real-time LSI calculator, chemical dosing, route optimization, and profit analytics. Offline-first. Built for the field."
url: "https://poolflowapp.com"
baseurl: ""
lang: "en"

markdown: kramdown
permalink: /blog/:title/
paginate: 10
paginate_path: "/blog/page:num/"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

author:
  name: "Alex Huggler"
  email: "contact@poolflowapp.com"

twitter:
  card: "summary_large_image"

# App Store link
app_store_url: "https://apps.apple.com/us/app/poolflow-pool-service-pro/id6759516755"

# Pro Annual temporary sale — set active: false to end the sale
annual_sale:
  active: true
  price: "$199.99"
  original_price: "$299.99"
  monthly_equivalent: "$16.67"
  savings: "$100"
  badge_text: "Limited Time Sale"

logo: "/assets/images/poolflow-icon-512.png"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "PoolFlow Team"
      image: "/assets/images/og-image.png"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - README.md
  - 01_App_Blueprint.md
  - 02_Product_Strategy.md
  - 03_Feature_Inventory.md
  - 04_Functional_Scope.md
  - 05_Customer_Journeys.md
  - privacy-policy.html
  - terms-of-service.html
  - Gemfile.lock
  - node_modules/
  - vendor/
  - package.json
  - package-lock.json
  - tailwind.config.js
  - .github/
