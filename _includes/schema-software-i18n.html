<script type="application/ld+json">
{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "PoolFlow",
  "operatingSystem": "iOS",
  "applicationCategory": "BusinessApplication",
  "applicationSubCategory": "PoolServiceManagement",
  "inLanguage": {{ page.lang | default: "en" | jsonify }},
  "availableLanguage": ["en", "es", "fr", "de", "pt", "nl"],
  "description": {{ page.description | jsonify }},
  "url": "https://poolflowapp.com",
  "sameAs": ["https://apps.apple.com/us/app/poolflow-pool-service-pro/id6759516755"],
  "offers": [
    { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free tier — up to 5 pools" },
    { "@type": "Offer", "price": "29.99", "priceCurrency": "USD", "description": "Pro Monthly — unlimited pools, all features" },
    { "@type": "Offer", "price": "299.99", "priceCurrency": "USD", "description": "Pro Annual — best value" }
  ],
  "featureList": [{% for feature in t.seo.feature_list %}{{ feature | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "audience": {
    "@type": "BusinessAudience",
    "audienceType": {{ t.seo.audience_label | default: "Solo pool service technicians and pool service providers" | jsonify }}
  },
  "author": { "@id": "https://poolflowapp.com/#org" },
  "publisher": { "@id": "https://poolflowapp.com/#org" }
}
</script>
