<script type="application/ld+json">
{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "PoolFlow",
  "operatingSystem": "iOS",
  "applicationCategory": "BusinessApplication",
  "applicationSubCategory": "PoolServiceManagement",
  "inLanguage": {{ page.lang | default: "en" | jsonify }},
  "availableLanguage": ["en", "es", "fr", "de", "pt", "nl"],
  "description": {{ page.description | jsonify }},
  "url": "https://poolflowapp.com",
  "sameAs": [{{ site.data.market.app_store.url | jsonify }}],
  "offers": [
    { "@type": "Offer", "price": {{ site.data.market.pricing.free.price | jsonify }}, "priceCurrency": {{ site.data.market.pricing.currency | jsonify }}, "description": "Free tier — up to {{ site.data.market.pricing.free.pool_limit }} pools" },
    { "@type": "Offer", "price": {{ site.data.market.pricing.monthly.price | jsonify }}, "priceCurrency": {{ site.data.market.pricing.currency | jsonify }}, "description": "Pro Monthly — unlimited pools, all features" },
    { "@type": "Offer", "price": {% if site.data.market.pricing.annual.sale_active %}{{ site.data.market.pricing.annual.sale_price | jsonify }}{% else %}{{ site.data.market.pricing.annual.regular_price | jsonify }}{% endif %}, "priceCurrency": {{ site.data.market.pricing.currency | jsonify }}, "description": "Pro Annual — best value" }
  ],
  "featureList": [{% for feature in t.seo.feature_list %}{{ feature | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "audience": {
    "@type": "BusinessAudience",
    "audienceType": {{ t.seo.audience_label | default: "Solo pool service technicians and pool service providers" | jsonify }}
  },
  "brand": { "@id": "https://poolflowapp.com/#brand" },
  "author": { "@id": "https://poolflowapp.com/#publisher" },
  "publisher": { "@id": "https://poolflowapp.com/#publisher" }
}
</script>
