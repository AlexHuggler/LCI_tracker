<!-- Favicon -->
<link rel="icon" type="image/png" sizes="192x192" href="/assets/images/poolflow-icon-192.png">
<link rel="apple-touch-icon" href="/assets/images/poolflow-icon-192.png">

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- hreflang tags for multilingual SEO -->
{% include hreflang.html %}

<!-- RSS feed -->
<link rel="alternate" type="application/rss+xml" title="PoolFlow Blog" href="{{ '/feed.xml' | absolute_url }}">

<!-- Preload LCP hero image (homepage only) -->
{% if page.url == '/' or page.layout == 'landing-i18n' %}<link rel="preload" href="/assets/images/hero-truck-pool.webp" as="image" type="image/webp">{% endif %}

{% assign seo_data = site.data.i18n[page.lang].seo %}

<!-- Open Graph Meta Tags -->
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:image" content="{{ page.image | default: '/assets/images/og-image.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ seo_data.og_image_alt | default: 'PoolFlow — pool service management iOS app for solo pool techs and pool service providers' | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta property="og:site_name" content="PoolFlow">
<meta property="og:locale" content="{{ page.og_locale | default: 'en_US' }}">
{% if page.og_locale_alternates %}{% for alt_locale in page.og_locale_alternates %}
<meta property="og:locale:alternate" content="{{ alt_locale }}">
{% endfor %}{% endif %}

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@poolflowapp">
<meta name="twitter:creator" content="@poolflowapp">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ page.image | default: '/assets/images/og-image.png' | absolute_url }}">
<meta name="twitter:image:alt" content="{{ seo_data.og_image_alt | default: 'PoolFlow — pool service management iOS app for solo pool techs and pool service providers' | escape }}">

<!-- Organization schema (canonical @id referenced by all other schemas) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://poolflowapp.com/#org",
  "name": "Huggler Holdings LLC",
  "legalName": "Huggler Holdings LLC",
  "url": "https://poolflowapp.com",
  "logo": {
    "@type": "ImageObject",
    "url": "https://poolflowapp.com/assets/images/poolflow-icon-512.png",
    "width": 512,
    "height": 512
  },
  "sameAs": [
    "https://apps.apple.com/us/app/poolflow-pool-service-pro/id6759516755"
  ]
}
</script>

<!-- WebSite schema for LLMO/AEO (tells LLMs and answer engines about multilingual support) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://poolflowapp.com/#website",
  "name": "PoolFlow",
  "url": "https://poolflowapp.com",
  "inLanguage": "{{ page.lang | default: 'en' }}",
  "availableLanguage": ["en", "es", "fr", "de", "pt", "nl"],
  "publisher": { "@id": "https://poolflowapp.com/#org" }
}
</script>
