  how_heading: "Por que o cloro livre acompanha o seu CYA"
  how_body: >-
    <p>O ácido cianúrico protege o cloro da luz solar fixando a maior parte dele em uma reserva de
    liberação lenta. O problema: quanto mais CYA você tem, mais cloro livre <strong>total</strong>
    precisa manter para conservar desinfetante <em>ativo</em> suficiente na água. Por isso um único
    alvo fixo de "1–3 ppm" é enganoso quando há estabilizador presente.</p>
    <p>Técnicos experientes gerenciam, em vez disso, a <strong>relação FC/CYA</strong>. A diretriz
    mais citada mantém o cloro livre em cerca de <strong>7,5% do nível de CYA</strong>:</p>
    <ul>
    <li>Com 30 ppm de CYA → alvo de 2–3 ppm de cloro livre</li>
    <li>Com 50 ppm de CYA → cerca de 4 ppm</li>
    <li>Com 80 ppm de CYA → cerca de 6 ppm</li>
    <li>Com 100 ppm de CYA → 7–8 ppm</li>
    </ul>
    <p>Piscinas de água salgada podem manter um alvo de manutenção um pouco mais baixo (~5% do CYA)
    porque a célula produz cloro continuamente. Para <strong>aplicar choque</strong> em uma
    piscina, eleve o cloro livre para cerca de 40% do CYA usando uma fonte não estabilizada para
    não adicionar mais estabilizador.</p>
    <p>Se o seu CYA continua subindo ou o cloro para de funcionar apesar de uma leitura normal,
    leia nosso guia completo sobre <a href="/blog/cya-cyanuric-acid-management/">como gerenciar o
    CYA e o bloqueio de cloro</a>, e verifique o equilíbrio geral com a
    <a href="/lsi-calculator/">calculadora LSI</a>.</p>
  faq_heading: "Perguntas frequentes sobre cloro livre"
  final_title: "Nunca mais adivinhe o cloro livre"
  final_body: "O PoolFlow acompanha o CYA e o cloro livre de cada piscina e sinaliza a água que está saindo do equilíbrio — offline, à beira da piscina. Grátis para até 5 piscinas."
  final_guide: "Ler o guia de CYA"
  faq:
    - question: "O que é a relação FC/CYA?"
      answer: "A relação FC/CYA é a relação entre o cloro livre (FC) e o ácido cianúrico (CYA) que mantém o cloro eficaz. Como o CYA fixa o cloro, o alvo certo de cloro livre escala com o seu nível de CYA. A diretriz mais citada é manter o cloro livre em cerca de 7,5% do seu CYA — por exemplo, cerca de 4 ppm de FC com 50 ppm de CYA."
    - question: "Quanto cloro livre minha piscina deve ter?"
      answer: "Depende do seu CYA. Com 30 ppm de CYA, mire 2–3 ppm de cloro livre; com 50 ppm, cerca de 4 ppm; com 80 ppm, cerca de 6 ppm. Um número fixo único como '1–3 ppm' é enganoso quando há CYA presente. Insira seu CYA acima para obter uma faixa-alvo para uma piscina manual ou de água salgada."
    - question: "Por que o ácido cianúrico muda o cloro de que preciso?"
      answer: "O CYA protege o cloro da luz UV do sol fixando a maior parte dele em uma reserva, liberando-o lentamente. A contrapartida é que quanto maior o seu CYA, mais cloro livre total você deve manter para a mesma quantidade de desinfetante ativo. Por isso uma piscina com 100 ppm de CYA precisa de muito mais cloro livre do que uma com 30 ppm para ficar livre de algas."
    - question: "Qual é o nível de choque para minha piscina?"
      answer: "Aplicar choque (ou um SLAM) eleva o cloro livre para cerca de 40% do nível de CYA para decompor as cloraminas e matar algas — por exemplo, cerca de 20 ppm de FC com 50 ppm de CYA. A calculadora mostra o alvo de choque ao lado da sua faixa normal. Aplique sempre o choque com uma fonte de cloro não estabilizada para não adicionar mais CYA."
    - question: "Piscinas de água salgada precisam de menos cloro?"
      answer: "Piscinas de água salgada seguem o mesmo princípio FC/CYA, mas como o gerador produz cloro continuamente, muitos operadores mantêm um alvo um pouco mais baixo — em torno de 5% do CYA — e às vezes mantêm o CYA um pouco mais alto (60–80 ppm) para proteção UV. O modo de água salgada da calculadora reflete esse alvo de manutenção mais baixo."
  js:
    ppm: "ppm"
    saltwater: " (água salgada)"
    formula: "Alvo ≈ %PCT%% de %CYA% ppm de CYA%SALT% = %FC% ppm. %SHOCK%"
    shock_note: "Choque a ~40% do CYA."

nl:
  title: "Vrijchloor-calculator — FC-doel op basis van CYA-niveau (FC/CYA-verhouding)"
  description: "Calculator voor het vrijchloordoel. Voer je cyanuurzuurniveau (CYA) in om met de gangbare FC/CYA-verhouding het juiste vrijchloorbereik te krijgen — voor handmatig gechloreerde en zoutwaterzwembaden, plus het shockniveau."
  h1: "Vrijchloor-doelcalculator"
  subtitle: "Het juiste vrijchloorbereik voor je zwembad hangt af van je CYA. Voer je stabilisatorniveau in en krijg een doel met de gangbare FC/CYA-verhouding."
  readings_heading: "Je stabilisatorniveau"
  pool_type_label: "Type zwembad"
  type_manual: "Handmatig gechloreerd"
  type_swg: "Zoutwater (SWG)"
  label_cya: "Cyanuurzuur (CYA)"
  cya_hint: "Ideaal CYA is 30–50 ppm voor handmatige zwembaden, vaak 60–80 voor zoutwater."
  result_label: "Vrijchloordoel"
  unit_ppm: "ppm"
  bd_min: "Minimaal FC"
  bd_target: "Doel-FC"
  bd_shock: "Shockniveau (SLAM)"
  cta_app: "Volg FC & CYA per zwembad"
  disclaimer: "Advies op basis van de breed gebruikte FC/CYA-verhouding. Het vervangt geen betrouwbare testkit of de eisen van lokale gezondheidsvoorschriften voor openbare zwembaden. Bevestig altijd met een actuele CYA- en FC-test."
  how_heading: "Waarom vrij chloor je CYA volgt"
  how_body: >-
    <p>Cyanuurzuur beschermt chloor tegen zonlicht door het grootste deel ervan vast te leggen in
    een langzaam vrijkomende reserve. Het nadeel: hoe meer CYA je hebt, hoe meer
    <strong>totaal</strong> vrij chloor je moet aanhouden om genoeg <em>actief</em>
    ontsmettingsmiddel in het water te houden. Daarom is één vast doel van "1–3 ppm" misleidend
    zodra er stabilisator aanwezig is.</p>
    <p>Ervaren technici sturen in plaats daarvan op de <strong>FC/CYA-verhouding</strong>. De
    meest aangehaalde richtlijn houdt vrij chloor op ongeveer <strong>7,5% van het
    CYA-niveau</strong>:</p>
    <ul>
    <li>Bij 30 ppm CYA → doel van 2–3 ppm vrij chloor</li>
    <li>Bij 50 ppm CYA → ongeveer 4 ppm</li>
    <li>Bij 80 ppm CYA → ongeveer 6 ppm</li>
    <li>Bij 100 ppm CYA → 7–8 ppm</li>
    </ul>
    <p>Zoutwaterzwembaden kunnen een iets lager onderhoudsdoel (~5% van het CYA) aanhouden omdat de
    cel continu chloor produceert. Om een zwembad te <strong>shocken</strong>, verhoog je het vrij
    chloor tot ongeveer 40% van het CYA met een niet-gestabiliseerde bron, zodat je niet nog meer
    stabilisator toevoegt.</p>
    <p>Als je CYA blijft stijgen of het chloor stopt met werken ondanks een normale meting, lees
    dan onze volledige gids over <a href="/blog/cya-cyanuric-acid-management/">het beheren van CYA
    en chloorslot</a>, en controleer de algehele balans met de
    <a href="/lsi-calculator/">LSI-calculator</a>.</p>
  faq_heading: "Vrijchloor-FAQ"
  final_title: "Gok nooit meer naar vrij chloor"
  final_body: "PoolFlow volgt CYA en vrij chloor voor elk zwembad en markeert water dat uit balans raakt — offline, aan de rand van het bad. Gratis voor maximaal 5 zwembaden."
  final_guide: "Lees de CYA-gids"
  faq:
    - question: "Wat is de FC/CYA-verhouding?"
      answer: "De FC/CYA-verhouding is de verhouding tussen vrij chloor (FC) en cyanuurzuur (CYA) die het chloor effectief houdt. Omdat CYA chloor vastlegt, schaalt het juiste vrijchloordoel mee met je CYA-niveau. De meest aangehaalde richtlijn is om vrij chloor op ongeveer 7,5% van je CYA te houden — bijvoorbeeld ongeveer 4 ppm FC bij 50 ppm CYA."
    - question: "Hoeveel vrij chloor moet mijn zwembad hebben?"
      answer: "Dat hangt af van je CYA. Bij 30 ppm CYA mik je op 2–3 ppm vrij chloor; bij 50 ppm ongeveer 4 ppm; bij 80 ppm rond 6 ppm. Eén vast getal zoals '1–3 ppm' is misleidend zodra er CYA aanwezig is. Voer hierboven je CYA in om een doelbereik te krijgen voor een handmatig of zoutwaterzwembad."
    - question: "Waarom verandert cyanuurzuur het chloor dat ik nodig heb?"
      answer: "CYA schermt chloor af van de UV-zon door het grootste deel ervan in een reserve vast te leggen en het langzaam vrij te geven. De afweging is dat hoe hoger je CYA, hoe meer totaal vrij chloor je moet aanhouden voor dezelfde hoeveelheid actief ontsmettingsmiddel. Daarom heeft een zwembad met 100 ppm CYA veel meer vrij chloor nodig dan een met 30 ppm om algvrij te blijven."
    - question: "Wat is het shockniveau voor mijn zwembad?"
      answer: "Shocken (of een SLAM) verhoogt het vrij chloor tot ongeveer 40% van het CYA-niveau om chlooraminen af te breken en algen te doden — bijvoorbeeld ongeveer 20 ppm FC bij 50 ppm CYA. De calculator toont het shockdoel naast je normale bereik. Shock altijd met een niet-gestabiliseerde chloorbron, zodat je niet nog meer CYA toevoegt."
    - question: "Hebben zoutwaterzwembaden minder chloor nodig?"
      answer: "Zoutwaterzwembaden volgen hetzelfde FC/CYA-principe, maar omdat de generator continu chloor produceert, houden veel beheerders een iets lager doel aan — rond 5% van het CYA — en houden ze het CYA soms wat hoger (60–80 ppm) voor UV-bescherming. De zoutwatermodus van de calculator weerspiegelt dit lagere onderhoudsdoel."
  js:
    ppm: "ppm"
    saltwater: " (zoutwater)"
    formula: "Doel ≈ %PCT% % van %CYA% ppm CYA%SALT% = %FC% ppm. %SHOCK%"
    shock_note: "Shock op ~40% van het CYA."
