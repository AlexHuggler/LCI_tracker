  how_heading: "Como o volume da piscina é calculado"
  how_body: >-
    <p>O volume da piscina é a base de cada cálculo químico. Se errar, cada dose seguinte
    fica errada na mesma porcentagem. Cada formato de piscina usa as dimensões da superfície, uma
    <strong>profundidade média</strong> e uma constante que converte pés cúbicos em galões:</p>
    <ul>
    <li><strong>Retangular:</strong> Comprimento × Largura × Profundidade média × <strong>7,48</strong></li>
    <li><strong>Redonda:</strong> Diâmetro × Diâmetro × Profundidade média × <strong>5,9</strong></li>
    <li><strong>Oval:</strong> Diâmetro maior × Diâmetro menor × Profundidade média × <strong>5,9</strong></li>
    <li><strong>Formato livre / rim:</strong> Comprimento × Largura × Profundidade média × 7,48 × <strong>Fator de forma</strong> (0,45–0,55)</li>
    </ul>
    <p class="text-center font-semibold text-pool-dark">Profundidade média = (Lado raso + Lado fundo) ÷ 2</p>
    <p>Por exemplo, uma piscina de 30 × 15 ft com profundidades de 3,5 ft e 8 ft tem uma profundidade média de 5,75 ft,
    então seu volume é 30 × 15 × 5,75 × 7,48 ≈ <strong>19.355 galões</strong> (arredonde para 19.500).</p>
    <p>Assim que souber seu volume, insira-o na <a href="/chemical-dosing-calculator/">calculadora de dosagem química</a>
    para dimensionar correções de pH, alcalinidade e cálcio, na <a href="/salt-calculator/">calculadora de sal</a> para seu gerador de cloro salino,
    ou na <a href="/pump-run-time-calculator/">calculadora de tempo de bomba</a> para a renovação da água. Para a química por trás de tudo isso,
    leia nosso <a href="/blog/chemical-dosing-calculations-pool-service/">guia de dosagem química</a>.</p>
  faq_heading: "Perguntas frequentes sobre o volume da piscina"
  final_title: "Calcule o volume uma vez, dose para sempre"
  final_body: "O PoolFlow guarda o volume de cada piscina e o usa para calcular doses químicas exatas a partir dos seus próprios custos — automaticamente, offline, à beira da piscina. Grátis para até 5 piscinas."
  final_cta_dosing: "Abrir a calculadora de dosagem"
  faq:
    - question: "Como se calcula o volume de uma piscina?"
      answer: "Multiplique as dimensões da superfície pela profundidade média e por uma constante de forma. Para uma piscina retangular: Comprimento × Largura × Profundidade média × 7,48 = galões. Para uma piscina redonda: Diâmetro × Diâmetro × Profundidade média × 5,9. A profundidade média é (lado raso + lado fundo) ÷ 2. Esta calculadora aplica a fórmula correta automaticamente assim que você escolhe o formato da sua piscina."
    - question: "Qual é a profundidade média de uma piscina?"
      answer: "A profundidade média é simplesmente (profundidade do lado raso + profundidade do lado fundo) ÷ 2. Uma piscina com um lado raso de 3,5 ft e um lado fundo de 8 ft tem uma profundidade média de 5,75 ft. Se a sua piscina tem profundidade constante, basta inserir o mesmo valor em ambas as extremidades."
    - question: "Por que o volume da piscina importa para a dosagem química?"
      answer: "Cada cálculo de dosagem escala com o volume — um erro de 20% no volume significa um erro de 20% em cada produto químico que você adiciona. Acertar o volume é a entrada mais importante para correções precisas de pH, alcalinidade, cálcio e sal. Meça e calcule uma vez em vez de herdar uma estimativa de um prestador de serviço anterior."
    - question: "Como calculo o volume de uma piscina de formato livre ou em formato de rim?"
      answer: "Meça o maior comprimento, a maior largura e a profundidade média, e depois aplique um fator de forma entre 0,45 e 0,55 para considerar as bordas curvas: Comprimento × Largura × Profundidade média × 7,48 × Fator de forma. Use cerca de 0,50 para um formato de rim típico. Esta calculadora inclui um controle deslizante de fator de forma para você ajustá-lo."
    - question: "Quantos galões tem uma piscina residencial típica?"
      answer: "A maioria das piscinas residenciais enterradas comporta entre 15.000 e 30.000 galões. Uma piscina retangular comum de 16×32 ft com profundidade média de 5,5 ft comporta cerca de 21.000 galões. Instalações elevadas e mini piscinas (spool) costumam ter de 5.000 a 12.000 galões."
