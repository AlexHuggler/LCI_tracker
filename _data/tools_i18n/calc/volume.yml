en:
  title: "Pool Volume Calculator — Gallons & Liters for Any Pool Shape"
  description: "Free pool volume calculator. Enter your pool's dimensions to instantly estimate gallons (or liters) for rectangular, round, oval, and freeform pools — the number every chemical dose depends on."
  h1: "Pool Volume Calculator"
  subtitle: "Estimate how many gallons (or liters) your pool holds. Pick a shape, enter the dimensions, and get the number every chemical dose depends on."
  dimensions_heading: "Pool Dimensions"
  unit_toggle_label: "ft / gal"
  unit_toggle_aria: "Unit system: US (feet & gallons). Tap to switch to metric."
  shape_heading: "Pool shape"
