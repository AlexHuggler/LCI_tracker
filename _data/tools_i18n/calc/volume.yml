  cta_app: "Guarda el volumen por piscina en la app"
  disclaimer: "Solo una estimación orientativa. Redondea el volumen final a los 500 galones más cercanos: variables como los contornos irregulares y los escalones introducen su propio margen de error. Confirma las dosis críticas con tus propias mediciones."
  how_heading: "Cómo se calcula el volumen de la piscina"
  how_body: >-
    <p>El volumen de la piscina es la base de cada cálculo químico. Si te equivocas, cada dosis posterior
    se equivoca en el mismo porcentaje. Cada forma de piscina usa las dimensiones de la superficie, una
    <strong>profundidad media</strong> y una constante que convierte los pies cúbicos en galones:</p>
    <ul>
    <li><strong>Rectangular:</strong> Largo × Ancho × Profundidad media × <strong>7,48</strong></li>
    <li><strong>Redonda:</strong> Diámetro × Diámetro × Profundidad media × <strong>5,9</strong></li>
    <li><strong>Ovalada:</strong> Diámetro mayor × Diámetro menor × Profundidad media × <strong>5,9</strong></li>
    <li><strong>Forma libre / riñón:</strong> Largo × Ancho × Profundidad media × 7,48 × <strong>Factor de forma</strong> (0,45–0,55)</li>
    </ul>
    <p class="text-center font-semibold text-pool-dark">Profundidad media = (Lado poco profundo + Lado profundo) ÷ 2</p>
    <p>Por ejemplo, una piscina de 30 × 15 ft con profundidades de 3,5 ft y 8 ft tiene una profundidad media de 5,75 ft,
    por lo que su volumen es 30 × 15 × 5,75 × 7,48 ≈ <strong>19 355 galones</strong> (redondea a 19 500).</p>
    <p>Una vez que conozcas tu volumen, introdúcelo en la <a href="/chemical-dosing-calculator/">calculadora de dosificación química</a>
    para ajustar las correcciones de pH, alcalinidad y calcio, en la <a href="/salt-calculator/">calculadora de sal</a> para tu clorador salino,
    o en la <a href="/pump-run-time-calculator/">calculadora de tiempo de bomba</a> para la renovación del agua. Para la química detrás de todo esto,
    lee nuestra <a href="/blog/chemical-dosing-calculations-pool-service/">guía de dosificación química</a>.</p>
  faq_heading: "Preguntas frecuentes sobre el volumen de la piscina"
  final_title: "Calcula el volumen una vez, dosifica para siempre"
  final_body: "PoolFlow guarda el volumen de cada piscina y lo usa para calcular las dosis químicas exactas a partir de tus propios costes: de forma automática, sin conexión, junto a la piscina. Gratis para hasta 5 piscinas."
  final_cta_dosing: "Abrir la calculadora de dosificación"
  faq:
    - question: "¿Cómo se calcula el volumen de una piscina?"
      answer: "Multiplica las dimensiones de la superficie por la profundidad media y una constante de forma. Para una piscina rectangular: Largo × Ancho × Profundidad media × 7,48 = galones. Para una piscina redonda: Diámetro × Diámetro × Profundidad media × 5,9. La profundidad media es (lado poco profundo + lado profundo) ÷ 2. Esta calculadora aplica la fórmula correcta automáticamente en cuanto eliges la forma de tu piscina."
    - question: "¿Cuál es la profundidad media de una piscina?"
      answer: "La profundidad media es simplemente (profundidad del lado poco profundo + profundidad del lado profundo) ÷ 2. Una piscina con un lado poco profundo de 3,5 ft y un lado profundo de 8 ft tiene una profundidad media de 5,75 ft. Si tu piscina tiene profundidad constante, introduce el mismo valor en ambos extremos."
    - question: "¿Por qué importa el volumen de la piscina para la dosificación química?"
      answer: "Cada cálculo de dosificación se escala con el volumen: un error del 20 % en el volumen significa un error del 20 % en cada producto químico que añades. Acertar con el volumen es el dato más importante para correcciones precisas de pH, alcalinidad, calcio y sal. Mídelo y calcúlalo una vez en lugar de heredar una estimación de un proveedor de servicio anterior."
    - question: "¿Cómo calculo el volumen de una piscina de forma libre o de riñón?"
      answer: "Mide el largo máximo, el ancho máximo y la profundidad media, y luego aplica un factor de forma entre 0,45 y 0,55 para tener en cuenta los bordes curvos: Largo × Ancho × Profundidad media × 7,48 × Factor de forma. Usa unos 0,50 para una forma de riñón típica. Esta calculadora incluye un control deslizante de factor de forma para que puedas ajustarlo."
    - question: "¿Cuántos galones tiene una piscina residencial típica?"
      answer: "La mayoría de las piscinas residenciales enterradas contienen entre 15 000 y 30 000 galones. Una piscina rectangular común de 16×32 ft con una profundidad media de 5,5 ft contiene aproximadamente 21 000 galones. Las instalaciones elevadas y las mini piscinas (spool) suelen tener entre 5000 y 12 000 galones."
