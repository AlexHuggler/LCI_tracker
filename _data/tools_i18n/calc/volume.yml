    <p>Een zwembad van 30 × 15 ft met dieptes van 3,5 ft en 8 ft heeft bijvoorbeeld een gemiddelde diepte van 5,75 ft,
    dus het volume is 30 × 15 × 5,75 × 7,48 ≈ <strong>19.355 gallons</strong> (afronden op 19.500).</p>
    <p>Zodra u uw volume kent, voert u het in de <a href="/chemical-dosing-calculator/">chemische doseringscalculator</a> in
