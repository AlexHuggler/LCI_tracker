  disclaimer: "Nur eine Schätzung zur Orientierung. Runden Sie Ihr endgültiges Volumen auf die nächsten 500 Gallonen — Variablen wie unregelmäßige Konturen und Stufen bringen ihre eigene Fehlertoleranz mit. Bestätigen Sie kritische Dosen anhand Ihrer eigenen Messungen."
  how_heading: "Wie das Poolvolumen berechnet wird"
  how_body: >-
    <p>Das Poolvolumen ist die Grundlage jeder Chemikalienberechnung. Wenn es falsch ist, ist jede
    nachgelagerte Dosis um denselben Prozentsatz falsch. Jede Poolform nutzt die Oberflächenmaße, eine
    <strong>durchschnittliche Tiefe</strong> und eine Konstante, die Kubikfuß in Gallonen umrechnet:</p>
    <ul>
    <li><strong>Rechteckig:</strong> Länge × Breite × Durchschnittliche Tiefe × <strong>7,48</strong></li>
    <li><strong>Rund:</strong> Durchmesser × Durchmesser × Durchschnittliche Tiefe × <strong>5,9</strong></li>
    <li><strong>Oval:</strong> Großer Durchmesser × Kleiner Durchmesser × Durchschnittliche Tiefe × <strong>5,9</strong></li>
    <li><strong>Freiform / Nierenform:</strong> Länge × Breite × Durchschnittliche Tiefe × 7,48 × <strong>Formfaktor</strong> (0,45–0,55)</li>
    </ul>
    <p class="text-center font-semibold text-pool-dark">Durchschnittliche Tiefe = (Flaches Ende + Tiefes Ende) ÷ 2</p>
    <p>Ein Pool von 30 × 15 ft mit Tiefen von 3,5 ft und 8 ft hat zum Beispiel eine durchschnittliche Tiefe von 5,75 ft,
    sein Volumen beträgt also 30 × 15 × 5,75 × 7,48 ≈ <strong>19.355 Gallonen</strong> (auf 19.500 runden).</p>
    <p>Sobald Sie Ihr Volumen kennen, geben Sie es in den <a href="/chemical-dosing-calculator/">Chemikaliendosierungs-Rechner</a> ein,
    um pH-, Alkalinitäts- und Kalziumkorrekturen zu bemessen, in den <a href="/salt-calculator/">Salzrechner</a> für Ihre Salzelektrolyse-Anlage
    oder in den <a href="/pump-run-time-calculator/">Pumpenlaufzeit-Rechner</a> für den Wasserumlauf. Für die Chemie dahinter
    lesen Sie unseren <a href="/blog/chemical-dosing-calculations-pool-service/">Leitfaden zur Chemikaliendosierung</a>.</p>
  faq_heading: "FAQ zum Poolvolumen"
  final_title: "Volumen einmal berechnen, für immer dosieren"
  final_body: "PoolFlow speichert das Volumen jedes Pools und nutzt es, um exakte Chemikaliendosen aus Ihren eigenen Kosten zu berechnen — automatisch, offline, am Beckenrand. Kostenlos für bis zu 5 Pools."
  final_cta_dosing: "Dosierungsrechner öffnen"
  faq:
    - question: "Wie berechnet man das Volumen eines Schwimmbeckens?"
      answer: "Multiplizieren Sie die Oberflächenmaße mit der durchschnittlichen Tiefe und einer Formkonstante. Für ein rechteckiges Becken: Länge × Breite × Durchschnittliche Tiefe × 7,48 = Gallonen. Für ein rundes Becken: Durchmesser × Durchmesser × Durchschnittliche Tiefe × 5,9. Die durchschnittliche Tiefe ist (flaches Ende + tiefes Ende) ÷ 2. Dieser Rechner wendet automatisch die richtige Formel an, sobald Sie Ihre Poolform wählen."
    - question: "Was ist die durchschnittliche Tiefe eines Pools?"
      answer: "Die durchschnittliche Tiefe ist einfach (Tiefe am flachen Ende + Tiefe am tiefen Ende) ÷ 2. Ein Pool mit einem flachen Ende von 3,5 ft und einem tiefen Ende von 8 ft hat eine durchschnittliche Tiefe von 5,75 ft. Wenn Ihr Pool eine konstante Tiefe hat, geben Sie einfach denselben Wert für beide Enden ein."
    - question: "Warum ist das Poolvolumen für die Chemikaliendosierung wichtig?"
      answer: "Jede Dosierungsberechnung skaliert mit dem Volumen — ein Fehler von 20 % beim Volumen bedeutet einen Fehler von 20 % bei jeder Chemikalie, die Sie hinzufügen. Das richtige Volumen ist die wichtigste Eingabe für genaue pH-, Alkalinitäts-, Kalzium- und Salzkorrekturen. Messen und berechnen Sie es einmal, statt eine Schätzung von einem früheren Dienstleister zu übernehmen."
    - question: "Wie berechne ich das Volumen eines Freiform- oder nierenförmigen Pools?"
      answer: "Messen Sie die größte Länge, die größte Breite und die durchschnittliche Tiefe und wenden Sie dann einen Formfaktor zwischen 0,45 und 0,55 an, um die gekrümmten Ränder zu berücksichtigen: Länge × Breite × Durchschnittliche Tiefe × 7,48 × Formfaktor. Verwenden Sie etwa 0,50 für eine typische Nierenform. Dieser Rechner enthält einen Formfaktor-Regler, mit dem Sie ihn fein einstellen können."
    - question: "Wie viele Gallonen fasst ein typischer Wohnpool?"
      answer: "Die meisten privaten Einbaupools fassen zwischen 15.000 und 30.000 Gallonen. Ein gängiger rechteckiger Pool von 16×32 ft mit einer durchschnittlichen Tiefe von 5,5 ft fasst rund 21.000 Gallonen. Aufstellpools und Mini-Pools (Spools) haben oft 5.000 bis 12.000 Gallonen."
