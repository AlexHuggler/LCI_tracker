  faq:
    - question: "Hoe bereken je het volume van een zwembad?"
      answer: "Vermenigvuldig de oppervlakteafmetingen met de gemiddelde diepte en een vormconstante. Voor een rechthoekig zwembad: Lengte × Breedte × Gemiddelde diepte × 7,48 = gallons. Voor een rond zwembad: Diameter × Diameter × Gemiddelde diepte × 5,9. De gemiddelde diepte is (ondiep einde + diep einde) ÷ 2. Deze calculator past automatisch de juiste formule toe zodra u uw zwembadvorm kiest."
    - question: "Wat is de gemiddelde diepte van een zwembad?"
      answer: "De gemiddelde diepte is simpelweg (diepte ondiep einde + diepte diep einde) ÷ 2. Een zwembad met een ondiep einde van 3,5 ft en een diep einde van 8 ft heeft een gemiddelde diepte van 5,75 ft. Als uw zwembad een constante diepte heeft, voert u gewoon dezelfde waarde in voor beide uiteinden."
    - question: "Waarom is het poolvolume belangrijk voor chemische dosering?"
      answer: "Elke doseringsberekening schaalt mee met het volume — een fout van 20% in het volume betekent een fout van 20% in elke chemische stof die u toevoegt. Het juiste volume is de belangrijkste invoer voor nauwkeurige correcties van pH, alkaliteit, calcium en zout. Meet en bereken het één keer in plaats van een schatting van een vorige dienstverlener over te nemen."
    - question: "Hoe bereken ik het volume van een zwembad met een vrije vorm of niervorm?"
      answer: "Meet de grootste lengte, de grootste breedte en de gemiddelde diepte, en pas vervolgens een vormfactor tussen 0,45 en 0,55 toe om rekening te houden met de gebogen randen: Lengte × Breedte × Gemiddelde diepte × 7,48 × Vormfactor. Gebruik ongeveer 0,50 voor een typische niervorm. Deze calculator bevat een vormfactorschuif zodat u deze kunt fijnafstellen."
    - question: "Hoeveel gallons heeft een typisch residentieel zwembad?"
      answer: "De meeste residentiële ingebouwde zwembaden bevatten tussen de 15.000 en 30.000 gallons. Een gangbaar rechthoekig zwembad van 16×32 ft met een gemiddelde diepte van 5,5 ft bevat ongeveer 21.000 gallons. Bovengrondse en mini-zwembaden (spool) hebben vaak 5.000 tot 12.000 gallons."
