  how_heading: "Comment le volume de la piscine est calculé"
  how_body: >-
    <p>Le volume de la piscine est la base de chaque calcul chimique. Si vous vous trompez, chaque dose
    en aval est fausse du même pourcentage. Chaque forme de piscine utilise les dimensions de surface, une
    <strong>profondeur moyenne</strong> et une constante qui convertit les pieds cubes en gallons :</p>
    <ul>
    <li><strong>Rectangulaire :</strong> Longueur × Largeur × Profondeur moyenne × <strong>7,48</strong></li>
    <li><strong>Ronde :</strong> Diamètre × Diamètre × Profondeur moyenne × <strong>5,9</strong></li>
    <li><strong>Ovale :</strong> Grand diamètre × Petit diamètre × Profondeur moyenne × <strong>5,9</strong></li>
    <li><strong>Forme libre / haricot :</strong> Longueur × Largeur × Profondeur moyenne × 7,48 × <strong>Facteur de forme</strong> (0,45–0,55)</li>
    </ul>
    <p class="text-center font-semibold text-pool-dark">Profondeur moyenne = (Petit bain + Grand bain) ÷ 2</p>
    <p>Par exemple, une piscine de 30 × 15 ft avec des profondeurs de 3,5 ft et 8 ft a une profondeur moyenne de 5,75 ft,
    donc son volume est 30 × 15 × 5,75 × 7,48 ≈ <strong>19 355 gallons</strong> (arrondir à 19 500).</p>
    <p>Une fois votre volume connu, saisissez-le dans le <a href="/chemical-dosing-calculator/">calculateur de dosage chimique</a>
    pour dimensionner les corrections de pH, d'alcalinité et de calcium, le <a href="/salt-calculator/">calculateur de sel</a> pour votre électrolyseur,
    ou le <a href="/pump-run-time-calculator/">calculateur de temps de pompe</a> pour le renouvellement. Pour la chimie derrière tout cela,
    lisez notre <a href="/blog/chemical-dosing-calculations-pool-service/">guide de dosage chimique</a>.</p>
  faq_heading: "FAQ sur le volume de la piscine"
  final_title: "Calculez le volume une fois, dosez pour toujours"
  final_body: "PoolFlow enregistre le volume de chaque piscine et l'utilise pour calculer les doses chimiques exactes à partir de vos propres coûts : automatiquement, hors ligne, au bord de la piscine. Gratuit jusqu'à 5 piscines."
  final_cta_dosing: "Ouvrir le calculateur de dosage"
  faq:
    - question: "Comment calculer le volume d'une piscine ?"
      answer: "Multipliez les dimensions de surface par la profondeur moyenne et une constante de forme. Pour une piscine rectangulaire : Longueur × Largeur × Profondeur moyenne × 7,48 = gallons. Pour une piscine ronde : Diamètre × Diamètre × Profondeur moyenne × 5,9. La profondeur moyenne est (petit bain + grand bain) ÷ 2. Ce calculateur applique automatiquement la bonne formule dès que vous choisissez la forme de votre piscine."
    - question: "Quelle est la profondeur moyenne d'une piscine ?"
      answer: "La profondeur moyenne est simplement (profondeur du petit bain + profondeur du grand bain) ÷ 2. Une piscine avec un petit bain de 3,5 ft et un grand bain de 8 ft a une profondeur moyenne de 5,75 ft. Si votre piscine est à profondeur constante, saisissez simplement la même valeur aux deux extrémités."
    - question: "Pourquoi le volume de la piscine est-il important pour le dosage chimique ?"
      answer: "Chaque calcul de dosage s'adapte au volume : une erreur de 20 % sur le volume signifie une erreur de 20 % sur chaque produit chimique que vous ajoutez. Avoir le bon volume est l'élément le plus important pour des corrections précises de pH, d'alcalinité, de calcium et de sel. Mesurez-le et calculez-le une fois plutôt que d'hériter d'une estimation d'un prestataire de service précédent."
    - question: "Comment calculer le volume d'une piscine de forme libre ou en haricot ?"
      answer: "Mesurez la longueur maximale, la largeur maximale et la profondeur moyenne, puis appliquez un facteur de forme entre 0,45 et 0,55 pour tenir compte des bords courbes : Longueur × Largeur × Profondeur moyenne × 7,48 × Facteur de forme. Utilisez environ 0,50 pour une forme en haricot typique. Ce calculateur inclut un curseur de facteur de forme pour que vous puissiez l'ajuster."
    - question: "Combien de gallons contient une piscine résidentielle typique ?"
      answer: "La plupart des piscines résidentielles enterrées contiennent entre 15 000 et 30 000 gallons. Une piscine rectangulaire courante de 16×32 ft avec une profondeur moyenne de 5,5 ft contient environ 21 000 gallons. Les installations hors-sol et les mini-piscines (spool) font souvent de 5 000 à 12 000 gallons."
