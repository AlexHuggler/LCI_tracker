  aria_shortD_slider: "Short diameter slider"
  aria_shallow: "Shallow-end depth"
  aria_shallow_slider: "Shallow-end depth slider"
  aria_deep: "Deep-end depth"
  aria_deep_slider: "Deep-end depth slider"
  aria_factor: "Shape factor"
  aria_factor_slider: "Shape factor slider"
  result_label: "Estimated Volume"
  breakdown_heading: "How it adds up"
  bd_avgdepth: "Average depth"
  bd_constant: "Shape constant"
  cta_app: "Store volume per pool in the app"
  disclaimer: "An estimate for guidance only. Round your final volume to the nearest 500 gallons — variables like irregular contours and step-outs introduce their own margin of error. Confirm critical doses against your own measurements."
  how_heading: "How Pool Volume Is Calculated"
  how_body: >-
    <p>Pool volume is the foundation of every chemical calculation. Get it wrong and every dose
    downstream is wrong by the same percentage. Each pool shape uses surface dimensions, an
    <strong>average depth</strong>, and a constant that converts cubic feet to gallons:</p>
    <ul>
    <li><strong>Rectangular:</strong> Length × Width × Average Depth × <strong>7.48</strong></li>
    <li><strong>Round:</strong> Diameter × Diameter × Average Depth × <strong>5.9</strong></li>
    <li><strong>Oval:</strong> Long Diameter × Short Diameter × Average Depth × <strong>5.9</strong></li>
    <li><strong>Freeform / kidney:</strong> Length × Width × Average Depth × 7.48 × <strong>Shape Factor</strong> (0.45–0.55)</li>
    </ul>
    <p class="text-center font-semibold text-pool-dark">Average depth = (Shallow end + Deep end) ÷ 2</p>
    <p>For example, a 30 × 15 ft pool with depths of 3.5 ft and 8 ft has an average depth of 5.75 ft,
    so its volume is 30 × 15 × 5.75 × 7.48 ≈ <strong>19,355 gallons</strong> (round to 19,500).</p>
    <p>Once you know your volume, plug it into the <a href="/chemical-dosing-calculator/">chemical dosing calculator</a>
    to size pH, alkalinity, and calcium corrections, the <a href="/salt-calculator/">salt calculator</a> for your SWG,
    or the <a href="/pump-run-time-calculator/">pump run-time calculator</a> for turnover. For the chemistry behind it all,
    read our <a href="/blog/chemical-dosing-calculations-pool-service/">chemical dosing guide</a>.</p>
  faq_heading: "Pool Volume FAQ"
  final_title: "Calculate Volume Once, Dose Forever"
  final_body: "PoolFlow stores each pool's volume and uses it to compute exact chemical doses from your own costs — automatically, offline, at poolside. Free for up to 5 pools."
  final_cta_dosing: "Open the Dosing Calculator"
  faq:
    - question: "How do you calculate the volume of a swimming pool?"
      answer: "Multiply the surface dimensions by the average depth and a shape constant. For a rectangular pool: Length × Width × Average Depth × 7.48 = gallons. For a round pool: Diameter × Diameter × Average Depth × 5.9. Average depth is (shallow end + deep end) ÷ 2. This calculator applies the right formula automatically once you pick your pool shape."
    - question: "What is the average depth of a pool?"
      answer: "Average depth is simply (shallow-end depth + deep-end depth) ÷ 2. A pool with a 3.5 ft shallow end and an 8 ft deep end has an average depth of 5.75 ft. If your pool is a constant depth, just enter the same value for both ends."
    - question: "Why does pool volume matter for chemical dosing?"
      answer: "Every dosing calculation scales with volume — a 20% error in volume means a 20% error in every chemical you add. Getting volume right is the single most important input for accurate pH, alkalinity, calcium, and salt corrections. Measure and calculate it once rather than inheriting an estimate from a previous service provider."
    - question: "How do I calculate the volume of a freeform or kidney-shaped pool?"
      answer: "Measure the longest length, the widest width, and the average depth, then apply a shape factor between 0.45 and 0.55 to account for the curved edges: Length × Width × Average Depth × 7.48 × Shape Factor. Use about 0.50 for a typical kidney shape. This calculator includes a shape-factor slider so you can dial it in."
    - question: "How many gallons is a typical residential pool?"
      answer: "Most residential in-ground pools hold between 15,000 and 30,000 gallons. A common 16×32 ft rectangular pool with an average depth of 5.5 ft holds roughly 21,000 gallons. Above-ground and spool (small pool) installations are often 5,000–12,000 gallons."
  js:
    gallons: "gallons"
    liters: "liters"
    avg_depth: "avg depth"
    unit_ft: "ft"
    unit_m: "m"
    toggle_us: "ft / gal"
    toggle_metric: "m / L"
    aria_us: "Unit system: US (feet & gallons). Tap to switch to metric."
    aria_metric: "Unit system: metric (meters & liters). Tap to switch to US."
    locale: "en-US"

