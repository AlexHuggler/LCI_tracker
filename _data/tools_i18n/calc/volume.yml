    <p>Het poolvolume is de basis van elke chemische berekening. Als het verkeerd is, is elke
    daaropvolgende dosis met hetzelfde percentage verkeerd. Elke zwembadvorm gebruikt de oppervlakteafmetingen, een
    <strong>gemiddelde diepte</strong> en een constante die kubieke voet omrekent naar gallons:</p>
    <ul>
    <li><strong>Rechthoekig:</strong> Lengte × Breedte × Gemiddelde diepte × <strong>7,48</strong></li>
    <li><strong>Rond:</strong> Diameter × Diameter × Gemiddelde diepte × <strong>5,9</strong></li>
