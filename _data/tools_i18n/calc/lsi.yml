  how_heading: "Hoe de LSI-berekening werkt"
  how_body: >-
    <p>De <strong>Langelier-verzadigingsindex (LSI)</strong> voorspelt of uw zwembadwater
    oppervlakken aantast, in balans blijft of kalk vormt. Het is de standaardmaat in de zwembadbranche
    voor calciumcarbonaatverzadiging en wordt berekend uit zes waarden:</p>
    <p class="text-center font-semibold text-pool-dark">LSI = pH + TF + CF + AF − TDS-constante</p>
    <ul>
    <li><strong>pH</strong> — rechtstreeks ingevoerd.</li>
    <li><strong>TF (temperatuurfactor)</strong> — warmer water verhoogt de LSI.</li>
    <li><strong>CF (calciumfactor)</strong> — uit de calciumhardheid.</li>
    <li><strong>AF (alkaliniteitsfactor)</strong> — uit de <em>CYA-gecorrigeerde</em> alkaliniteit.</li>
    <li><strong>TDS-constante</strong> — 12,1 voor typische zwembaden, 12,2 voor zwembaden met hoge TDS of zout water.</li>
