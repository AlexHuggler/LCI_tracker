  final_guide: "LSI-Leitfaden lesen"
  faq:
    - question: "Was ist ein guter LSI für einen Swimmingpool?"
      answer: "Ein ausgeglichener Pool hat einen LSI zwischen −0,3 und +0,3. Unter −0,3 ist das Wasser korrosiv und kann Putz angreifen und Metall korrodieren; über +0,3 ist es kalkbildend und kann Calcium auf Oberflächen und Geräten ablagern. Halten Sie den LSI möglichst nahe bei 0,0."
    - question: "Wie wirkt sich Cyanursäure (CYA) auf den LSI aus?"
      answer: "Cyanursäure trägt zu Ihrem Messwert der Gesamtalkalinität bei, aber nicht zur Carbonatalkalinität, die das Wasser tatsächlich puffert, daher muss sie abgezogen werden. Dieser Rechner wendet die Standardkorrektur an: korrigierte Alkalinität = Gesamtalkalinität − (CYA ÷ 3). Höheres CYA senkt Ihre effektive Alkalinität und damit den LSI."
    - question: "Wie wird der LSI berechnet?"
      answer: "Der Langelier-Sättigungsindex lautet LSI = pH + TF + CF + AF − TDS-Konstante, wobei TF ein Temperaturfaktor, CF ein Calciumhärtefaktor, AF ein Alkalinitätsfaktor (mit CYA-korrigierter Alkalinität) ist und die TDS-Konstante 12,1 für typische Pools beträgt (12,2 für Pools mit hohem TDS oder Salzwasser). Dieses Tool verwendet dieselben Nachschlagefaktoren wie unser LSI-Erklärleitfaden."
    - question: "Was bedeutet ein negativer LSI?"
      answer: "Ein negativer LSI (unter −0,3) bedeutet, dass das Wasser mit Calciumcarbonat untersättigt ist — korrosives Wasser. Es kann Putz und Fugen auflösen, Beton anlöchern und Metallarmaturen, Leitern und Heizungen korrodieren. Erhöhen Sie den LSI, indem Sie den pH-Wert, die Gesamtalkalinität oder die Calciumhärte anheben."
    - question: "Was bedeutet ein hoher LSI?"
      answer: "Ein hoher LSI (über +0,3) bedeutet, dass das Wasser übersättigt ist — kalkbildendes Wasser. Es kann Kalkablagerungen auf Fliesen, Putz, Salzzellen und Wärmetauschern bilden und das Wasser trüben. Senken Sie den LSI, indem Sie den pH-Wert, die Gesamtalkalinität oder die Calciumhärte reduzieren."
    - question: "Ist dieser LSI-Rechner kostenlos?"
      answer: "Ja — er ist völlig kostenlos und läuft vollständig in Ihrem Browser. Für einen automatischen LSI bei jedem Pool sowie Chemikaliendosier-Empfehlungen mit Preisen aus Ihrem eigenen Bestand berechnet die PoolFlow-iOS-App dies für Sie vor Ort, sogar offline."
