    guidance_corrosive: "Water is corrosive (LSI %LSI%). Low LSI water can etch plaster, dissolve grout, and corrode metal fittings and heaters. To raise LSI, increase pH, total alkalinity, or calcium hardness."
    guidance_scaling: "Water is scale-forming (LSI %LSI%). High LSI water can deposit calcium scale on surfaces, salt cells, and heat exchangers, and cloud the water. To lower LSI, reduce pH, total alkalinity, or calcium hardness."
