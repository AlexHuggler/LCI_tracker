    <h3>De CYA-correctie</h3>
    <p>Cyanuurzuur verhoogt uw meetwaarde van de totale alkaliniteit zonder het water te bufferen, dus
    het moet eerst worden verwijderd:</p>
    <p class="text-center font-semibold text-pool-dark">Aangepaste alkaliniteit = Totale alkaliniteit − (CYA ÷ 3)</p>
    <p>Bijvoorbeeld: 100&nbsp;ppm totale alkaliniteit met 60&nbsp;ppm CYA geeft een aangepaste alkaliniteit
    van 100&nbsp;−&nbsp;20&nbsp;=&nbsp;80&nbsp;ppm, wat de alkaliniteitsfactor hierboven voedt.</p>
    <h3>Uw resultaat aflezen</h3>
    <ul>
    <li><strong>Onder −0,3:</strong> corrosief — verhoog de pH, alkaliniteit of calcium.</li>
    <li><strong>−0,3 tot +0,3:</strong> in balans — handhaven.</li>
    <li><strong>Boven +0,3:</strong> kalkvormend — verlaag de pH, alkaliniteit of calcium.</li>
    </ul>
