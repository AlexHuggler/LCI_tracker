  title: "Calculadora de LSI gratuita para piscinas — Índice de Saturação de Langelier com correção de CYA"
  description: "Calculadora de LSI interativa e gratuita. Insira o pH, a temperatura, a dureza cálcica, a alcalinidade, o CYA e os TDS para calcular instantaneamente o Índice de Saturação de Langelier da sua piscina e ver se a água está corrosiva, equilibrada ou incrustante."
  h1: "Calculadora de LSI para piscinas"
  subtitle: "Calcule o Índice de Saturação de Langelier em tempo real com alcalinidade corrigida por CYA. Arraste suas leituras e veja o equilíbrio atualizar instantaneamente."
