  disclaimer: "Apenas para orientação. Os resultados usam fatores de consulta padrão do setor com interpolação linear e podem diferir ligeiramente de outras calculadoras. Confirme sempre com um kit de teste confiável antes de adicionar produtos químicos."
  how_heading: "Como funciona o cálculo do LSI"
  how_body: >-
    <p>O <strong>Índice de Saturação de Langelier (LSI)</strong> prevê se a água da sua piscina
    vai corroer superfícies, permanecer equilibrada ou formar incrustações. É a medida padrão do setor
    para a saturação de carbonato de cálcio e é calculada a partir de seis leituras:</p>
    <p class="text-center font-semibold text-pool-dark">LSI = pH + TF + CF + AF − constante&nbsp;de&nbsp;TDS</p>
    <ul>
    <li><strong>pH</strong> — inserido diretamente.</li>
    <li><strong>TF (fator de temperatura)</strong> — água mais quente aumenta o LSI.</li>
    <li><strong>CF (fator de cálcio)</strong> — a partir da dureza cálcica.</li>
    <li><strong>AF (fator de alcalinidade)</strong> — a partir da alcalinidade <em>corrigida por CYA</em>.</li>
    <li><strong>Constante de TDS</strong> — 12,1 para piscinas típicas, 12,2 para piscinas com TDS alto ou de água salgada.</li>
    </ul>
    <h3>A correção de CYA</h3>
    <p>O ácido cianúrico infla a leitura da sua alcalinidade total sem tamponar a água, por isso
    precisa ser removido primeiro:</p>
    <p class="text-center font-semibold text-pool-dark">Alcalinidade ajustada = Alcalinidade total − (CYA ÷ 3)</p>
    <p>Por exemplo, 100&nbsp;ppm de alcalinidade total com 60&nbsp;ppm de CYA resultam em uma alcalinidade ajustada
    de 100&nbsp;−&nbsp;20&nbsp;=&nbsp;80&nbsp;ppm, que é o que alimenta o fator de alcalinidade acima.</p>
    <h3>Como interpretar seu resultado</h3>
    <ul>
    <li><strong>Abaixo de −0,3:</strong> corrosiva — aumente o pH, a alcalinidade ou o cálcio.</li>
    <li><strong>De −0,3 a +0,3:</strong> equilibrada — mantenha.</li>
    <li><strong>Acima de +0,3:</strong> incrustante — reduza o pH, a alcalinidade ou o cálcio.</li>
    </ul>
    <p>Quer o detalhamento completo, as tabelas de fatores e exemplos resolvidos? Leia
    <a href="/blog/langelier-saturation-index-explained/">O Índice de Saturação de Langelier, explicado</a>,
    ou veja nosso <a href="/blog/pool-water-balance-chemistry-guide/">guia de equilíbrio da água da piscina</a>.</p>
  faq_heading: "Perguntas frequentes sobre a calculadora de LSI"
  final_title: "Pare de calcular o LSI à mão"
  final_body: "O PoolFlow calcula o LSI de cada piscina automaticamente e recomenda doses químicas exatas a partir dos seus próprios custos — offline, à beira da piscina. Gratuito para até 5 piscinas."
  final_guide: "Leia o guia do LSI"
  faq:
    - question: "Qual é um bom LSI para uma piscina?"
      answer: "Uma piscina equilibrada tem um LSI entre −0,3 e +0,3. Abaixo de −0,3 a água é corrosiva e pode atacar o revestimento e corroer o metal; acima de +0,3 é incrustante e pode depositar cálcio em superfícies e equipamentos. Procure manter o LSI o mais próximo possível de 0,0."
    - question: "Como o ácido cianúrico (CYA) afeta o LSI?"
      answer: "O ácido cianúrico contribui para a leitura da sua alcalinidade total, mas não para a alcalinidade de carbonatos que realmente tampona a água, por isso deve ser subtraído. Esta calculadora aplica a correção padrão: alcalinidade ajustada = alcalinidade total − (CYA ÷ 3). Um CYA mais alto reduz a sua alcalinidade efetiva e, portanto, diminui o LSI."
    - question: "Como o LSI é calculado?"
      answer: "O Índice de Saturação de Langelier é LSI = pH + TF + CF + AF − constante de TDS, onde TF é um fator de temperatura, CF um fator de dureza cálcica, AF um fator de alcalinidade (usando a alcalinidade corrigida por CYA) e a constante de TDS é 12,1 para piscinas típicas (12,2 para piscinas com TDS alto ou de água salgada). Esta ferramenta usa os mesmos fatores de consulta do nosso guia explicativo do LSI."
    - question: "O que significa um LSI negativo?"
      answer: "Um LSI negativo (abaixo de −0,3) significa que a água está subsaturada de carbonato de cálcio — água corrosiva. Pode dissolver o revestimento e o rejunte, corroer o concreto e corroer conexões metálicas, escadas e aquecedores. Aumente o LSI elevando o pH, a alcalinidade total ou a dureza cálcica."
    - question: "O que significa um LSI alto?"
      answer: "Um LSI alto (acima de +0,3) significa que a água está supersaturada — água incrustante. Pode depositar incrustações de cálcio em azulejos, revestimento, células de sal e trocadores de calor, e deixar a água turva. Reduza o LSI diminuindo o pH, a alcalinidade total ou a dureza cálcica."
    - question: "Esta calculadora de LSI é gratuita?"
      answer: "Sim — é totalmente gratuita e roda inteiramente no seu navegador. Para o LSI automático em cada piscina, além de recomendações de dosagem química com preços do seu próprio estoque, o aplicativo PoolFlow para iOS calcula isso para você em campo, mesmo offline."
