es:
  title: "Calculadora gratuita de LSI para piscinas — Índice de saturación de Langelier con corrección de CYA"
  description: "Calculadora de LSI interactiva y gratuita. Introduce el pH, la temperatura, la dureza cálcica, la alcalinidad, el CYA y los TDS para calcular al instante el Índice de saturación de Langelier de tu piscina y ver si el agua es corrosiva, equilibrada o incrustante."
  h1: "Calculadora de LSI para piscinas"
  subtitle: "Calcula el Índice de saturación de Langelier en tiempo real con alcalinidad corregida por CYA. Desliza tus lecturas y observa cómo se actualiza el equilibrio al instante."
  balanced_note: "El agua equilibrada se sitúa entre −0,3 y +0,3 de LSI."
  readings_heading: "Las lecturas de tu agua"
  label_ph: "pH"
  label_temp: "Temperatura del agua"
  label_ch: "Dureza cálcica"
  label_ta: "Alcalinidad total"
  label_cya: "Ácido cianúrico (CYA)"
  label_tds: "Sólidos disueltos totales"
  result_label: "Tu LSI"
  breakdown_heading: "Cómo se calcula"
  bd_tf: "Factor de temperatura (TF)"
  bd_cf: "Factor de calcio (CF)"
  bd_af: "Factor de alcalinidad (AF)"
  bd_adj: "Alcalinidad corregida por CYA"
  bd_k: "Constante de TDS"
  cta_app: "Obtén la dosificación exacta en la app"
  disclaimer: "Solo a título orientativo. Los resultados usan factores de consulta estándar del sector con interpolación lineal y pueden diferir ligeramente de otras calculadoras. Confirma siempre con un kit de análisis fiable antes de añadir productos químicos."
  how_heading: "Cómo funciona el cálculo del LSI"
  how_body: >-
    <p>El <strong>Índice de saturación de Langelier (LSI)</strong> predice si el agua de tu piscina
    corroerá las superficies, se mantendrá equilibrada o formará incrustaciones. Es la medida estándar
    del sector de la saturación de carbonato cálcico y se calcula a partir de seis lecturas:</p>
    <p class="text-center font-semibold text-pool-dark">LSI = pH + TF + CF + AF − constante&nbsp;de&nbsp;TDS</p>
    <ul>
    <li><strong>pH</strong> — se introduce directamente.</li>
    <li><strong>TF (factor de temperatura)</strong> — el agua más cálida aumenta el LSI.</li>
    <li><strong>CF (factor de calcio)</strong> — a partir de la dureza cálcica.</li>
    <li><strong>AF (factor de alcalinidad)</strong> — a partir de la alcalinidad <em>corregida por CYA</em>.</li>
    <li><strong>Constante de TDS</strong> — 12,1 para piscinas típicas, 12,2 para piscinas con TDS altos o de agua salada.</li>
    </ul>
    <h3>La corrección de CYA</h3>
    <p>El ácido cianúrico infla la lectura de tu alcalinidad total sin amortiguar el agua, por lo que
    debe eliminarse primero:</p>
    <p class="text-center font-semibold text-pool-dark">Alcalinidad ajustada = Alcalinidad total − (CYA ÷ 3)</p>
    <p>Por ejemplo, 100&nbsp;ppm de alcalinidad total con 60&nbsp;ppm de CYA dan una alcalinidad ajustada
    de 100&nbsp;−&nbsp;20&nbsp;=&nbsp;80&nbsp;ppm, que es lo que alimenta el factor de alcalinidad anterior.</p>
    <h3>Cómo interpretar tu resultado</h3>
    <ul>
    <li><strong>Por debajo de −0,3:</strong> corrosiva — sube el pH, la alcalinidad o el calcio.</li>
    <li><strong>De −0,3 a +0,3:</strong> equilibrada — mantén los niveles.</li>
    <li><strong>Por encima de +0,3:</strong> incrustante — baja el pH, la alcalinidad o el calcio.</li>
    </ul>
    <p>¿Quieres el desglose completo, las tablas de factores y ejemplos resueltos? Lee
    <a href="/blog/langelier-saturation-index-explained/">El Índice de saturación de Langelier, explicado</a>,
    o consulta nuestra <a href="/blog/pool-water-balance-chemistry-guide/">guía de equilibrio del agua de la piscina</a>.</p>
  faq_heading: "Preguntas frecuentes sobre la calculadora de LSI"
  final_title: "Deja de calcular el LSI a mano"
  final_body: "PoolFlow calcula el LSI de cada piscina automáticamente y recomienda dosis químicas exactas a partir de tus propios costes, sin conexión y a pie de piscina. Gratis para hasta 5 piscinas."
  final_guide: "Lee la guía del LSI"
  faq:
    - question: "¿Cuál es un buen LSI para una piscina?"
      answer: "Una piscina equilibrada tiene un LSI entre −0,3 y +0,3. Por debajo de −0,3 el agua es corrosiva y puede atacar el revoque y corroer el metal; por encima de +0,3 es incrustante y puede depositar calcio en superficies y equipos. Intenta mantener el LSI lo más cerca posible de 0,0."
    - question: "¿Cómo afecta el ácido cianúrico (CYA) al LSI?"
      answer: "El ácido cianúrico contribuye a la lectura de tu alcalinidad total, pero no a la alcalinidad de carbonatos que realmente amortigua el agua, por lo que debe restarse. Esta calculadora aplica la corrección estándar: alcalinidad ajustada = alcalinidad total − (CYA ÷ 3). Un CYA más alto reduce tu alcalinidad efectiva y, por tanto, baja el LSI."
    - question: "¿Cómo se calcula el LSI?"
      answer: "El Índice de saturación de Langelier es LSI = pH + TF + CF + AF − constante de TDS, donde TF es un factor de temperatura, CF un factor de dureza cálcica, AF un factor de alcalinidad (usando la alcalinidad corregida por CYA) y la constante de TDS es 12,1 para piscinas típicas (12,2 para piscinas con TDS altos o de agua salada). Esta herramienta usa los mismos factores de consulta que nuestra guía explicativa del LSI."
    - question: "¿Qué significa un LSI negativo?"
      answer: "Un LSI negativo (por debajo de −0,3) significa que el agua está subsaturada de carbonato cálcico, es decir, agua corrosiva. Puede disolver el revoque y la lechada, picar el hormigón y corroer accesorios metálicos, escaleras y calentadores. Sube el LSI aumentando el pH, la alcalinidad total o la dureza cálcica."
    - question: "¿Qué significa un LSI alto?"
      answer: "Un LSI alto (por encima de +0,3) significa que el agua está sobresaturada, es decir, agua incrustante. Puede depositar incrustaciones de calcio en azulejos, revoque, celdas de sal e intercambiadores de calor, y enturbiar el agua. Baja el LSI reduciendo el pH, la alcalinidad total o la dureza cálcica."
    - question: "¿Es gratuita esta calculadora de LSI?"
      answer: "Sí, es totalmente gratuita y se ejecuta por completo en tu navegador. Para obtener el LSI automático de cada piscina, además de recomendaciones de dosificación química con precios de tu propio inventario, la app de PoolFlow para iOS lo calcula por ti sobre el terreno, incluso sin conexión."
