    - question: "Hoe beïnvloedt cyanuurzuur (CYA) de LSI?"
      answer: "Cyanuurzuur draagt bij aan uw meetwaarde van de totale alkaliniteit, maar niet aan de carbonaatalkaliniteit die het water daadwerkelijk buffert, dus het moet worden afgetrokken. Deze calculator past de standaardcorrectie toe: aangepaste alkaliniteit = totale alkaliniteit − (CYA ÷ 3). Een hogere CYA verlaagt uw effectieve alkaliniteit en daarmee de LSI."
    - question: "Hoe wordt de LSI berekend?"
      answer: "De Langelier-verzadigingsindex is LSI = pH + TF + CF + AF − TDS-constante, waarbij TF een temperatuurfactor is, CF een calciumhardheidsfactor, AF een alkaliniteitsfactor (met CYA-gecorrigeerde alkaliniteit) en de TDS-constante 12,1 is voor typische zwembaden (12,2 voor zwembaden met hoge TDS of zout water). Deze tool gebruikt dezelfde opzoekfactoren als onze LSI-uitlegg ids."
    - question: "Wat betekent een negatieve LSI?"
      answer: "Een negatieve LSI (onder −0,3) betekent dat het water onderverzadigd is met calciumcarbonaat — corrosief water. Het kan pleisterwerk en voegen oplossen, beton aantasten en metalen fittingen, ladders en verwarmers corroderen. Verhoog de LSI door de pH, totale alkaliniteit of calciumhardheid te verhogen."
