fr:
  title: "Calculateur LSI gratuit pour piscine — Indice de saturation de Langelier avec correction du CYA"
  description: "Calculateur LSI interactif et gratuit. Saisissez le pH, la température, la dureté calcique, l’alcalinité, le CYA et les TDS pour calculer instantanément l’indice de saturation de Langelier de votre piscine et voir si l’eau est corrosive, équilibrée ou entartrante."
  h1: "Calculateur LSI pour piscine"
  subtitle: "Calculez l’indice de saturation de Langelier en temps réel avec une alcalinité corrigée du CYA. Faites glisser vos relevés et observez l’équilibre se mettre à jour instantanément."
  balanced_note: "Une eau équilibrée se situe entre −0,3 et +0,3 de LSI."
  readings_heading: "Vos relevés d’eau"
  label_ph: "pH"
  label_temp: "Température de l’eau"
  label_ch: "Dureté calcique"
  label_ta: "Alcalinité totale"
  label_cya: "Acide cyanurique (CYA)"
  label_tds: "Solides dissous totaux"
  result_label: "Votre LSI"
  breakdown_heading: "Le détail du calcul"
  bd_tf: "Facteur de température (TF)"
  bd_cf: "Facteur de calcium (CF)"
  bd_af: "Facteur d’alcalinité (AF)"
  bd_adj: "Alcalinité corrigée du CYA"
  bd_k: "Constante de TDS"
  cta_app: "Obtenez le dosage exact dans l’application"
  disclaimer: "À titre indicatif uniquement. Les résultats utilisent des facteurs de référence standard du secteur avec interpolation linéaire et peuvent différer légèrement d’autres calculateurs. Vérifiez toujours avec un kit d’analyse fiable avant d’ajouter des produits chimiques."
  how_heading: "Comment fonctionne le calcul du LSI"
  how_body: >-
    <p>L’<strong>indice de saturation de Langelier (LSI)</strong> prédit si l’eau de votre piscine
    va corroder les surfaces, rester équilibrée ou former du tartre. C’est la mesure standard du secteur
    de la saturation en carbonate de calcium, et elle se calcule à partir de six relevés :</p>
    <p class="text-center font-semibold text-pool-dark">LSI = pH + TF + CF + AF − constante&nbsp;de&nbsp;TDS</p>
    <ul>
    <li><strong>pH</strong> — saisi directement.</li>
    <li><strong>TF (facteur de température)</strong> — une eau plus chaude augmente le LSI.</li>
    <li><strong>CF (facteur de calcium)</strong> — à partir de la dureté calcique.</li>
    <li><strong>AF (facteur d’alcalinité)</strong> — à partir de l’alcalinité <em>corrigée du CYA</em>.</li>
    <li><strong>Constante de TDS</strong> — 12,1 pour les piscines typiques, 12,2 pour les piscines à TDS élevé ou au sel.</li>
    </ul>
    <h3>La correction du CYA</h3>
    <p>L’acide cyanurique gonfle votre relevé d’alcalinité totale sans tamponner l’eau, il doit donc
    être retiré en premier :</p>
    <p class="text-center font-semibold text-pool-dark">Alcalinité ajustée = Alcalinité totale − (CYA ÷ 3)</p>
    <p>Par exemple, 100&nbsp;ppm d’alcalinité totale avec 60&nbsp;ppm de CYA donnent une alcalinité ajustée
    de 100&nbsp;−&nbsp;20&nbsp;=&nbsp;80&nbsp;ppm, qui alimente le facteur d’alcalinité ci-dessus.</p>
    <h3>Comment lire votre résultat</h3>
    <ul>
    <li><strong>En dessous de −0,3 :</strong> corrosive — augmentez le pH, l’alcalinité ou le calcium.</li>
    <li><strong>De −0,3 à +0,3 :</strong> équilibrée — maintenez.</li>
    <li><strong>Au-dessus de +0,3 :</strong> entartrante — baissez le pH, l’alcalinité ou le calcium.</li>
    </ul>
    <p>Vous voulez le détail complet, les tableaux de facteurs et des exemples résolus ? Lisez
    <a href="/blog/langelier-saturation-index-explained/">L’indice de saturation de Langelier, expliqué</a>,
    ou consultez notre <a href="/blog/pool-water-balance-chemistry-guide/">guide d’équilibre de l’eau de piscine</a>.</p>
  faq_heading: "FAQ du calculateur LSI"
  final_title: "Arrêtez de calculer le LSI à la main"
  final_body: "PoolFlow calcule le LSI de chaque piscine automatiquement et recommande des doses chimiques exactes à partir de vos propres coûts — hors ligne, au bord du bassin. Gratuit jusqu’à 5 piscines."
  final_guide: "Lire le guide LSI"
  faq:
    - question: "Quel est un bon LSI pour une piscine ?"
      answer: "Une piscine équilibrée a un LSI compris entre −0,3 et +0,3. En dessous de −0,3, l’eau est corrosive et peut attaquer le plâtre et corroder le métal ; au-dessus de +0,3, elle est entartrante et peut déposer du calcium sur les surfaces et les équipements. Essayez de maintenir le LSI aussi proche de 0,0 que possible."
    - question: "Comment l’acide cyanurique (CYA) affecte-t-il le LSI ?"
      answer: "L’acide cyanurique contribue à votre relevé d’alcalinité totale, mais pas à l’alcalinité carbonatée qui tamponne réellement l’eau ; il doit donc être soustrait. Ce calculateur applique la correction standard : alcalinité ajustée = alcalinité totale − (CYA ÷ 3). Un CYA plus élevé réduit votre alcalinité effective et abaisse donc le LSI."
    - question: "Comment le LSI est-il calculé ?"
      answer: "L’indice de saturation de Langelier est LSI = pH + TF + CF + AF − constante de TDS, où TF est un facteur de température, CF un facteur de dureté calcique, AF un facteur d’alcalinité (utilisant l’alcalinité corrigée du CYA) et la constante de TDS vaut 12,1 pour les piscines typiques (12,2 pour les piscines à TDS élevé ou au sel). Cet outil utilise les mêmes facteurs de référence que notre guide explicatif du LSI."
    - question: "Que signifie un LSI négatif ?"
      answer: "Un LSI négatif (en dessous de −0,3) signifie que l’eau est sous-saturée en carbonate de calcium — une eau corrosive. Elle peut dissoudre le plâtre et le joint, piquer le béton et corroder les raccords métalliques, les échelles et les chauffages. Augmentez le LSI en relevant le pH, l’alcalinité totale ou la dureté calcique."
    - question: "Que signifie un LSI élevé ?"
      answer: "Un LSI élevé (au-dessus de +0,3) signifie que l’eau est sursaturée — une eau entartrante. Elle peut déposer du tartre calcaire sur le carrelage, le plâtre, les cellules de sel et les échangeurs de chaleur, et rendre l’eau trouble. Abaissez le LSI en réduisant le pH, l’alcalinité totale ou la dureté calcique."
    - question: "Ce calculateur LSI est-il gratuit ?"
      answer: "Oui — il est entièrement gratuit et fonctionne intégralement dans votre navigateur. Pour un LSI automatique sur chaque piscine, ainsi que des recommandations de dosage chimique chiffrées à partir de votre propre inventaire, l’application iOS PoolFlow le calcule pour vous sur le terrain, même hors ligne."
