  title: "Kostenloser Pool-LSI-Rechner — Langelier-Sättigungsindex mit CYA-Korrektur"
  description: "Kostenloser interaktiver LSI-Rechner. Geben Sie pH-Wert, Temperatur, Calciumhärte, Alkalinität, CYA und TDS ein, um sofort den Langelier-Sättigungsindex Ihres Pools zu berechnen und zu sehen, ob das Wasser korrosiv, ausgeglichen oder kalkbildend ist."
  h1: "Pool-LSI-Rechner"
  subtitle: "Berechnen Sie den Langelier-Sättigungsindex in Echtzeit mit CYA-korrigierter Alkalinität. Verschieben Sie Ihre Messwerte und beobachten Sie, wie sich das Gleichgewicht sofort aktualisiert."
