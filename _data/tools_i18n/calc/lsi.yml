  readings_heading: "Ihre Wasserwerte"
  label_ph: "pH-Wert"
  label_temp: "Wassertemperatur"
  label_ch: "Calciumhärte"
  label_ta: "Gesamtalkalinität"
  label_cya: "Cyanursäure (CYA)"
  label_tds: "Gesamtgelöste Feststoffe"
  result_label: "Ihr LSI"
  breakdown_heading: "So setzt es sich zusammen"
  bd_tf: "Temperaturfaktor (TF)"
  bd_cf: "Calciumfaktor (CF)"
  bd_af: "Alkalinitätsfaktor (AF)"
  bd_adj: "CYA-korrigierte Alkalinität"
  bd_k: "TDS-Konstante"
  cta_app: "Exakte Dosierung in der App erhalten"
  disclaimer: "Nur als Orientierung. Die Ergebnisse verwenden branchenübliche Nachschlagefaktoren mit linearer Interpolation und können geringfügig von anderen Rechnern abweichen. Bestätigen Sie immer mit einem zuverlässigen Testkit, bevor Sie Chemikalien hinzufügen."
  how_heading: "So funktioniert die LSI-Berechnung"
  how_body: >-
    <p>Der <strong>Langelier-Sättigungsindex (LSI)</strong> sagt voraus, ob Ihr Poolwasser
    Oberflächen korrodiert, ausgeglichen bleibt oder Kalk bildet. Er ist das branchenübliche Maß
    für die Calciumcarbonat-Sättigung und wird aus sechs Messwerten berechnet:</p>
    <p class="text-center font-semibold text-pool-dark">LSI = pH + TF + CF + AF − TDS-Konstante</p>
    <ul>
    <li><strong>pH-Wert</strong> — direkt eingegeben.</li>
    <li><strong>TF (Temperaturfaktor)</strong> — wärmeres Wasser erhöht den LSI.</li>
    <li><strong>CF (Calciumfaktor)</strong> — aus der Calciumhärte.</li>
    <li><strong>AF (Alkalinitätsfaktor)</strong> — aus der <em>CYA-korrigierten</em> Alkalinität.</li>
    <li><strong>TDS-Konstante</strong> — 12,1 für typische Pools, 12,2 für Pools mit hohem TDS oder Salzwasser.</li>
    </ul>
    <h3>Die CYA-Korrektur</h3>
    <p>Cyanursäure bläht Ihren Messwert der Gesamtalkalinität auf, ohne das Wasser zu puffern, daher
    muss sie zuerst entfernt werden:</p>
    <p class="text-center font-semibold text-pool-dark">Korrigierte Alkalinität = Gesamtalkalinität − (CYA ÷ 3)</p>
    <p>Zum Beispiel ergeben 100&nbsp;ppm Gesamtalkalinität mit 60&nbsp;ppm CYA eine korrigierte Alkalinität
    von 100&nbsp;−&nbsp;20&nbsp;=&nbsp;80&nbsp;ppm, die in den obigen Alkalinitätsfaktor einfließt.</p>
    <h3>So lesen Sie Ihr Ergebnis</h3>
    <ul>
    <li><strong>Unter −0,3:</strong> korrosiv — pH-Wert, Alkalinität oder Calcium erhöhen.</li>
    <li><strong>−0,3 bis +0,3:</strong> ausgeglichen — beibehalten.</li>
    <li><strong>Über +0,3:</strong> kalkbildend — pH-Wert, Alkalinität oder Calcium senken.</li>
    </ul>
    <p>Möchten Sie die vollständige Aufschlüsselung, die Faktortabellen und durchgerechnete Beispiele? Lesen Sie
    <a href="/blog/langelier-saturation-index-explained/">Der Langelier-Sättigungsindex, erklärt</a>,
    oder sehen Sie sich unseren <a href="/blog/pool-water-balance-chemistry-guide/">Leitfaden zum Wassergleichgewicht im Pool</a> an.</p>
