nl:
  title: "Zoutrekenmachine voor zoutwaterzwembad — ponden zout voor je zoutelektrolyse"
  description: "Gratis zoutrekenmachine voor zoutwaterzwembaden. Voer je zwembadvolume, huidige zoutgehalte en streefzoutgehalte in om precies te weten hoeveel ponden zout (en zakken van 40 lb) je voor je zoutelektrolyse moet toevoegen."
  h1: "Zoutrekenmachine voor zoutwaterzwembad"
  subtitle: "Bereken precies hoeveel zout je moet toevoegen om het doel van je zoutelektrolyse te bereiken. Voer je volume en zoutmetingen in — krijg ponden en zakken van 40 lb."
  readings_heading: "Je zwembad en zoutgehalte"
  label_vol: "Zwembadvolume"
  label_current: "Huidig zoutgehalte"
  label_target: "Streefzoutgehalte"
  vol_hint_pre: "Niet zeker?"
  vol_hint_link: "Gebruik de volumerekenmachine →"
  target_hint: "De meeste zoutelektrolyses mikken op 2.700–3.400 ppm. Volg de handleiding van je cel."
  result_label: "Toe te voegen zout"
  formula_heading: ""
  cta_app: "Houd zout en chemie per zwembad bij"
  disclaimer: "Alleen ter indicatie. Voeg het zout in fasen toe met de pomp aan en wacht daarna ~24 uur voordat je opnieuw meet. Het is makkelijker om bij te voegen dan te verdunnen — schiet niet door je doel heen."
  how_heading: "Hoe de zoutberekening werkt"
  how_body: >-
    <p>Zout wordt gemeten in delen per miljoen (ppm). Om het zoutgehalte met een bekende hoeveelheid
    te verhogen, voeg je zout toe in verhouding tot het watergewicht van je zwembad:</p>
    <p class="text-center font-semibold text-pool-dark">Ponden zout = (Doel − Huidig) × Gallons × 8,34 ÷ 1.000.000</p>
    <p>De 8,34 is het gewicht van één gallon water in ponden. Voor een zwembad van 15.000 gallons dat
    start op 0 ppm en mikt op 3.200 ppm: (3.200 − 0) × 15.000 × 8,34 ÷ 1.000.000 ≈ <strong>400 ponden</strong>,
    oftewel ongeveer tien zakken van 40 lb.</p>
    <h3>Een paar tips uit de praktijk</h3>
    <ul>
    <li><strong>Voeg in fasen toe.</strong> Strooi het zout over het hele zwembad met de pomp aan en borstel het richting de afvoer om het op te lossen.</li>
    <li><strong>Wacht met meten.</strong> Laat het ~24 uur circuleren voordat je het zoutgehalte afleest — onopgelost zout wordt niet geregistreerd.</li>
    <li><strong>Zout kun je niet verwijderen.</strong> Als je boven het doel zit, is de enige oplossing gedeeltelijk aftappen en bijvullen met vers water.</li>
    </ul>
    <p>Bepaal je volume met de <a href="/pool-volume-calculator/">zwembadvolume-rekenmachine</a>, controleer de algehele
    balans met de <a href="/lsi-calculator/">LSI-rekenmachine</a>, en onthoud dat zoutcellen de pH na verloop van tijd
    verhogen — houd de <a href="/chemical-dosing-calculator/">doseerrekenmachine</a> bij de hand.</p>
  faq_heading: "Veelgestelde vragen over de zoutrekenmachine"
  final_title: "Beheer elk zoutwaterzwembad in één app"
  final_body: "PoolFlow houdt zoutgehalte, chemie en dosering bij voor elk zwembad op je route — offline, aan de rand van het bad. Gratis voor maximaal 5 zwembaden."
  final_guide: "Controleer de waterbalans (LSI)"
  faq:
    - question: "Hoeveel zout voeg ik toe aan mijn zoutwaterzwembad?"
      answer: "Ponden zout = (streef-ppm − huidige ppm) × gallons × 8,34 ÷ 1.000.000. Voor een zwembad van 15.000 gallons dat van 0 naar 3.200 ppm gaat, is dat ongeveer 400 ponden, oftewel ruwweg tien zakken van 40 lb. Deze rekenmachine doet de berekening zodra je je volume en zoutmetingen invoert."
    - question: "Welk zoutgehalte moet een zoutwaterzwembad hebben?"
      answer: "De meeste zoutelektrolyses werken het best tussen 2.700 en 3.400 ppm, waarbij 3.200 ppm een gangbaar doel is — maar volg altijd de aanbeveling van de fabrikant van je zoutelektrolyse. Te laag en de cel produceert geen chloor; te hoog en je riskeert corrosie en een hoog-zoutstoring. Deze tool gebruikt standaard 3.200 ppm en laat je dit aanpassen."
    - question: "Hoe verlaag ik het zoutgehalte in mijn zwembad?"
      answer: "Er bestaat geen chemisch middel dat zout verwijdert. De enige manier om het zoutgehalte te verlagen is een deel van het zwembad af te tappen en bij te vullen met vers water, wat de zoutconcentratie verdunt. Als je meting al op of boven het doel zit, vertelt deze rekenmachine je dat er geen zout nodig is en raadt ze verdunnen aan als je erboven zit."
    - question: "Hoe lang na het toevoegen van zout kan ik meten?"
      answer: "Voeg het zout toe met de pomp aan en borstel het rond om het te helpen oplossen. Wacht ongeveer 24 uur met de pomp aan voordat je een zoutmeting doet, want onopgelost zout wordt niet nauwkeurig geregistreerd. Voeg in fasen toe richting je doel in plaats van eroverheen te schieten — het is veel makkelijker om bij te voegen dan te verdunnen."
    - question: "Beïnvloedt het toevoegen van zout de overige zwembadchemie?"
      answer: "Zout zelf is vrij neutraal, maar zoutelektrolyses hebben de neiging de pH na verloop van tijd te verhogen terwijl ze chloor produceren, dus let op de pH en de totale alkaliteit nadat je de cel hebt ingeschakeld. Controleer de algehele waterbalans met de LSI-rekenmachine en corrigeer de pH zo nodig met de doseerrekenmachine."
