    secondary_none: "lb — geen zout nodig"
    guidance_at_target: "Je zit precies op het doel. Geen zout nodig."
    guidance_over: "Je zit %PPM% ppm boven het doel. Zout kan niet chemisch worden verwijderd — tap gedeeltelijk af en vul bij met vers water om te verdunnen."
    secondary: "lb &nbsp;·&nbsp; ≈ %BAGS% zakken (40 lb) &nbsp;·&nbsp; %KG% kg"
    guidance_add: "Verhoog het zoutgehalte met %PPM% ppm. Voeg in fasen toe met de pomp aan en meet opnieuw na ~24 uur."
    formula: "(%TARGET% − %CURRENT%) ppm × %GAL% gal × 8,34 ÷ 1.000.000 = %LBS% lb"
