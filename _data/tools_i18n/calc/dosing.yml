    <p>Deze calculator schaalt vier standaard professionele doseringspercentages naar je zwembadvolume
    (in stappen van 10.000 gallon) en de grootte van elke correctie:</p>
    <ul>
    <li><strong>pH verlagen</strong> — zoutzuur (31,45%): <strong>26 fl oz</strong> per 0,2 pH-daling per 10.000 gal</li>
    <li><strong>pH verhogen</strong> — soda: <strong>6 oz</strong> per 0,2 pH-stijging per 10.000 gal</li>
    <li><strong>Alkaliniteit verhogen</strong> — natriumbicarbonaat: <strong>24 oz</strong> per 10 ppm per 10.000 gal</li>
    <li><strong>Calciumhardheid verhogen</strong> — calciumchloride (77%): <strong>20 oz</strong> per 10 ppm per 10.000 gal</li>
    </ul>
    <p>Bijvoorbeeld: een zwembad van 20.000 gallon dat de pH van 7,8 naar 7,4 verlaagt (een daling van 0,4,
    twee stappen van 0,2) heeft 26 × 2 × 2,0 = <strong>104 fl oz</strong> zoutzuur nodig, ongeveer 0,8 gallon.</p>
    <h3>Waarom de volgorde telt</h3>
    <p>Corrigeer altijd eerst de pH, dan de alkaliniteit, dan het calcium — alkaliniteits- en
    calciumcorrecties verschuiven beide de pH, dus de pH eerst instellen betekent minder hercorrecties.
    Alkaliniteit of calcium verlagen is geen eenvoudige dosis: alkaliniteit daalt via zuur plus beluchting,
    en calcium alleen via gedeeltelijk aftappen.</p>
    <p>Eerst je zwembadvolume nodig? Gebruik de <a href="/pool-volume-calculator/">zwembadvolumecalculator</a>.
    Voor de volledige methode, veiligheidsprotocollen en uitgewerkte voorbeelden lees je onze
    <a href="/blog/chemical-dosing-calculations-pool-service/">gids voor chemische dosering</a>, en
    controleer de waterbalans met de <a href="/lsi-calculator/">LSI-calculator</a>.</p>
  faq_heading: "Veelgestelde vragen over chemische dosering"
