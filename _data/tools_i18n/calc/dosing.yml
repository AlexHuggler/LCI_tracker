    sub_calcium: "77 %, pour augmenter la dureté"
    unit_floz: "fl oz"
    unit_oz: "oz"
    note_alkalinity: "Baissez l'alcalinité avec de l'acide chlorhydrique + aération (un cycle répété, pas une seule dose)."
    note_calcium: "La dureté calcique ne peut être baissée que par vidange partielle et remplissage avec une eau plus douce."

de:
  title: "Chemikalien-Dosierrechner für den Pool — Säure, Soda, Alkalinität & Calcium"
  description: "Kostenloser Chemikalien-Dosierrechner für den Pool. Geben Sie Ihr Poolvolumen sowie Ist- und Zielwerte für pH, Alkalinität und Calciumhärte ein, um exakte Dosen an Salzsäure, Soda, Natron und Calciumchlorid zu erhalten — samt geschätzten Kosten."
  h1: "Chemikalien-Dosierrechner für den Pool"
  subtitle: "Geben Sie Ihr Poolvolumen und Ihre Ist- gegenüber den Zielwerten ein. Erhalten Sie exakte Dosen an Salzsäure, Soda, Natron und Calciumchlorid — mit geschätzten Kosten pro Besuch."
  readings_heading: "Ihr Pool & Ihre Messwerte"
  label_vol: "Poolvolumen"
  vol_unit_gal: "gal"
  vol_aria_gal: "Volumeneinheit: Gallonen. Tippen, um zu Litern zu wechseln."
  vol_hint_pre: "Nicht sicher?"
  vol_hint_link: "Volumenrechner verwenden →"
  label_ph: "pH"
  label_ta: "Gesamtalkalinität"
  label_ch: "Calciumhärte"
  col_current: "Aktuell"
  col_target: "Ziel"
  order_note: "Geben Sie die Chemikalien der Reihe nach zu — pH, dann Alkalinität, dann Calcium — dazwischen umwälzen und neu messen."
  result_label: "Empfohlene Dosen"
  empty_note: "Ihr Wasser ist bereits auf dem Zielwert — keine Zugabe nötig."
  cost_label: "Geschätzte Chemikalienkosten"
  cta_app: "Dosen mit Ihren eigenen Kosten berechnen"
  disclaimer: "Die Kostenschätzungen verwenden typische Chemikalienpreise und gehen von Standardkonzentrationen aus (Salzsäure 31,45 %, Calciumchlorid 77 %). Nur als Orientierung — Chemikalien niemals mischen, geeignete PSA tragen und vor weiterer Zugabe immer nach einem vollständigen Umwälzzyklus erneut messen."
  how_heading: "Die Dosierraten hinter den Zahlen"
  how_body: >-
    <p>Dieser Rechner skaliert vier professionelle Standard-Dosierraten nach Ihrem Poolvolumen
    (in 10.000-Gallonen-Schritten) und der Größe jeder Korrektur:</p>
    <ul>
    <li><strong>pH senken</strong> — Salzsäure (31,45 %): <strong>26 fl oz</strong> je 0,2 pH-Absenkung je 10.000 gal</li>
    <li><strong>pH anheben</strong> — Soda: <strong>6 oz</strong> je 0,2 pH-Anhebung je 10.000 gal</li>
    <li><strong>Alkalinität anheben</strong> — Natriumbicarbonat (Natron): <strong>24 oz</strong> je 10 ppm je 10.000 gal</li>
    <li><strong>Calciumhärte anheben</strong> — Calciumchlorid (77 %): <strong>20 oz</strong> je 10 ppm je 10.000 gal</li>
    </ul>
    <p>Beispiel: Ein Pool mit 20.000 Gallonen, der den pH von 7,8 auf 7,4 senkt (eine Reduktion von 0,4,
    zwei 0,2-Schritte), benötigt 26 × 2 × 2,0 = <strong>104 fl oz</strong> Salzsäure, etwa 0,8 Gallonen.</p>
    <h3>Warum die Reihenfolge zählt</h3>
    <p>Korrigieren Sie immer zuerst den pH, dann die Alkalinität, dann das Calcium — Alkalinitäts- und
    Calciumkorrekturen verschieben beide den pH, daher bedeutet ein zuerst eingestellter pH weniger
    Nachkorrekturen. Alkalinität oder Calcium zu senken ist keine einfache Dosis: Alkalinität sinkt
    durch Säure plus Belüftung, Calcium nur durch teilweises Ablassen.</p>
    <p>Brauchen Sie zuerst Ihr Poolvolumen? Verwenden Sie den <a href="/pool-volume-calculator/">Poolvolumen-Rechner</a>.
    Für die vollständige Methode, Sicherheitsprotokolle und gelöste Beispiele lesen Sie unseren
    <a href="/blog/chemical-dosing-calculations-pool-service/">Leitfaden zur Chemikaliendosierung</a> und
    prüfen Sie das Wassergleichgewicht mit dem <a href="/lsi-calculator/">LSI-Rechner</a>.</p>
  faq_heading: "FAQ zur Chemikaliendosierung"
  final_title: "Schluss mit der Dosierrechnung von Hand"
  final_body: "PoolFlow liest Ihre Testergebnisse, berechnet exakte Dosen mit diesen Raten und bepreist jede aus Ihrem echten Chemikalienbestand — automatisch, offline, direkt am Pool. Kostenlos für bis zu 5 Pools."
  final_guide: "Dosierleitfaden lesen"
  faq:
    - question: "Wie viel Salzsäure brauche ich, um den pH zu senken?"
      answer: "Bei Standard-Salzsäure mit 31,45 % verwenden Sie etwa 26 Flüssigunzen je 0,2 pH-Absenkung je 10.000 Gallonen. Dieser Rechner skaliert diese Rate automatisch nach Ihrem Poolvolumen und der Größe der pH-Absenkung. Für einen Pool mit 15.000 Gallonen, der den pH von 8,0 auf 7,4 senkt (eine Reduktion von 0,6), ergibt das rund 117 fl oz, also etwa 0,9 Gallonen. Geben Sie Säure immer ins Wasser, niemals Wasser in die Säure, und verteilen Sie sie bei laufender Pumpe."
    - question: "Wie viel Natron hebt die Pool-Alkalinität an?"
      answer: "Natriumbicarbonat (Natron) hebt die Gesamtalkalinität um etwa 24 Unzen je 10 ppm Anstieg je 10.000 Gallonen. Für einen Pool mit 15.000 Gallonen, der von 60 auf 90 ppm geht (ein Anstieg von 30 ppm), sind das rund 108 Unzen, also etwa 6,75 Pfund. Natron wird für die Alkalinität dem Soda vorgezogen, da es den pH kaum beeinflusst."
    - question: "In welcher Reihenfolge sollte ich Pool-Chemikalien zugeben?"
      answer: "Stellen Sie zuerst den pH ein, dann die Gesamtalkalinität, dann die Calciumhärte. Sowohl Alkalinitäts- als auch Calciumkorrekturen können den pH verschieben, daher reduziert ein zuerst eingestellter pH die Zahl der Nachkorrekturen. Wälzen Sie das Wasser um und warten Sie zwischen den Zugaben — etwa 15–20 Minuten nach Salzsäure, 20–30 nach Soda und 15 nach Calciumchlorid — und messen Sie erneut, bevor Sie die nächste Korrektur vornehmen."
    - question: "Kann ich Gesamtalkalinität oder Calciumhärte mit einer Chemikalie senken?"
      answer: "Nicht direkt. Die Gesamtalkalinität zu senken erfordert die Zugabe von Salzsäure, um pH und TA gemeinsam zu senken, und anschließendes Belüften, um den pH wieder anzuheben, ohne die Alkalinität zu erhöhen — oft ein wiederholter Zyklus, keine einzelne Dosis. Calciumhärte lässt sich nur durch teilweises Ablassen und Auffüllen mit weicherem Wasser senken. Dieser Rechner kennzeichnet beide Fälle, statt eine Dosis zu nennen."
    - question: "Wie genau ist dieser Dosierrechner?"
      answer: "Er verwendet dieselben branchenüblichen Raten wie ein professioneller Dosiermotor, skaliert auf Ihr Volumen. Reale Ergebnisse schwanken je nach Chemikalienkonzentration, Wassertemperatur und Messgenauigkeit, messen Sie daher nach einem Umwälzzyklus immer erneut, bevor Sie mehr zugeben. Behandeln Sie die Dosen als guten Ausgangspunkt, nicht als Ersatz für ein zuverlässiges Testkit."
