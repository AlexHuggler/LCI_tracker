pt:
  title: "Calculadora de dosagem química para piscina — ácido, barrilha, alcalinidade e cálcio"
  description: "Calculadora gratuita de dosagem química para piscina. Insira o volume da sua piscina e os valores atuais frente aos alvos de pH, alcalinidade e dureza cálcica para obter doses exatas de ácido muriático, barrilha, bicarbonato e cloreto de cálcio — além de um custo estimado."
  h1: "Calculadora de dosagem química para piscina"
  subtitle: "Insira o volume da sua piscina e as suas leituras atuais frente às alvo. Obtenha doses exatas de ácido muriático, barrilha, bicarbonato e cloreto de cálcio — com um custo estimado por visita."
  readings_heading: "Sua piscina e suas leituras"
  label_vol: "Volume da piscina"
  vol_unit_gal: "gal"
  vol_aria_gal: "Unidade de volume: galões. Toque para mudar para litros."
  vol_hint_pre: "Não tem certeza?"
  vol_hint_link: "Use a calculadora de volume →"
  label_ph: "pH"
  label_ta: "Alcalinidade total"
  label_ch: "Dureza cálcica"
  col_current: "Atual"
  col_target: "Alvo"
  order_note: "Adicione os produtos na ordem — pH, depois alcalinidade e por fim cálcio — circulando a água e medindo de novo entre cada um."
  result_label: "Doses recomendadas"
  empty_note: "Sua água já está no alvo — nenhuma adição necessária."
  cost_label: "Custo químico estimado"
  cta_app: "Calcule doses com seus próprios custos"
  disclaimer: "As estimativas de custo usam preços químicos típicos e pressupõem concentrações padrão (ácido muriático a 31,45%, cloreto de cálcio a 77%). Apenas para orientação — nunca misture produtos químicos, use EPI adequado e meça sempre de novo após um ciclo de circulação completo antes de adicionar mais."
  how_heading: "As taxas de dosagem por trás dos números"
  how_body: >-
    <p>Esta calculadora aplica quatro taxas de dosagem profissionais padrão conforme o volume da sua
    piscina (em incrementos de 10.000 galões) e o tamanho de cada correção:</p>
    <ul>
    <li><strong>Baixar o pH</strong> — ácido muriático (31,45%): <strong>26 fl oz</strong> por queda de 0,2 de pH por 10.000 gal</li>
    <li><strong>Subir o pH</strong> — barrilha: <strong>6 oz</strong> por subida de 0,2 de pH por 10.000 gal</li>
    <li><strong>Subir a alcalinidade</strong> — bicarbonato de sódio: <strong>24 oz</strong> por 10 ppm por 10.000 gal</li>
    <li><strong>Subir a dureza cálcica</strong> — cloreto de cálcio (77%): <strong>20 oz</strong> por 10 ppm por 10.000 gal</li>
    </ul>
    <p>Por exemplo, uma piscina de 20.000 galões baixando o pH de 7,8 para 7,4 (uma redução de 0,4, dois
    incrementos de 0,2) precisa de 26 × 2 × 2,0 = <strong>104 fl oz</strong> de ácido muriático, cerca de 0,8 galão.</p>
    <h3>Por que a ordem importa</h3>
    <p>Corrija sempre o pH primeiro, depois a alcalinidade e por fim o cálcio — os ajustes de alcalinidade
    e de cálcio empurram ambos o pH, então acertar o pH primeiro significa menos recorreções. Baixar a
    alcalinidade ou o cálcio não é uma dose simples: a alcalinidade desce com ácido mais aeração, e o
    cálcio só por esvaziamento parcial.</p>
    <p>Precisa primeiro do volume da sua piscina? Use a <a href="/pool-volume-calculator/">calculadora de
    volume de piscina</a>. Para o método completo, protocolos de segurança e exemplos resolvidos, leia o
    nosso <a href="/blog/chemical-dosing-calculations-pool-service/">guia de dosagem química</a>, e
    verifique o equilíbrio da água com a <a href="/lsi-calculator/">calculadora LSI</a>.</p>
  faq_heading: "Perguntas frequentes sobre dosagem química"
  final_title: "Pare de fazer as contas de dosagem à mão"
  final_body: "O PoolFlow lê os seus resultados de análise, calcula doses exatas com estas taxas e precifica cada uma com o seu estoque químico real — automaticamente, offline, à beira da piscina. Grátis para até 5 piscinas."
  final_guide: "Leia o guia de dosagem"
  faq:
    - question: "Quanto ácido muriático preciso para baixar o pH?"
      answer: "Com ácido muriático padrão a 31,45%, use cerca de 26 onças líquidas por redução de 0,2 de pH por 10.000 galões. Esta calculadora aplica essa taxa automaticamente conforme o volume da sua piscina e o tamanho da queda de pH. Para uma piscina de 15.000 galões baixando o pH de 8,0 para 7,4 (uma redução de 0,6), dá cerca de 117 fl oz, ou aproximadamente 0,9 galão. Adicione sempre o ácido à água, nunca a água ao ácido, e distribua-o com a bomba ligada."
    - question: "Quanto bicarbonato sobe a alcalinidade da piscina?"
      answer: "O bicarbonato de sódio sobe a alcalinidade total a cerca de 24 onças por aumento de 10 ppm por 10.000 galões. Para uma piscina de 15.000 galões passando de 60 para 90 ppm (um aumento de 30 ppm), são cerca de 108 onças, ou aproximadamente 6,75 libras. O bicarbonato é preferido à barrilha para a alcalinidade porque tem efeito mínimo sobre o pH."
    - question: "Em que ordem devo adicionar os produtos químicos da piscina?"
      answer: "Ajuste o pH primeiro, depois a alcalinidade total e por fim a dureza cálcica. Tanto as correções de alcalinidade quanto as de cálcio podem deslocar o pH, então acertar o pH primeiro reduz o número de recorreções. Circule a água e espere entre as adições — cerca de 15–20 minutos após o ácido muriático, 20–30 após a barrilha e 15 após o cloreto de cálcio — e meça de novo antes de aplicar a próxima correção."
    - question: "Posso baixar a alcalinidade total ou a dureza cálcica com um produto químico?"
      answer: "Não diretamente. Baixar a alcalinidade total exige adicionar ácido muriático para reduzir o pH e a TA juntos e depois arejar para o pH subir sem elevar a alcalinidade — muitas vezes um ciclo repetido, não uma única dose. A dureza cálcica só pode ser baixada esvaziando parcialmente e reabastecendo com água de menor dureza. Esta calculadora sinaliza ambos os casos em vez de dar uma dose."
    - question: "Qual a precisão desta calculadora de dosagem?"
      answer: "Ela usa as mesmas taxas padrão do setor que um motor de dosagem profissional usa, escaladas ao seu volume. Os resultados reais variam conforme a concentração do produto, a temperatura da água e a precisão da análise, então meça sempre de novo após um ciclo de circulação antes de adicionar mais. Trate as doses como um bom ponto de partida, não como substituto de um kit de análise confiável."
