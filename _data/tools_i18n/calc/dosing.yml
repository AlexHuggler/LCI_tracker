  final_body: "PoolFlow leest je testresultaten, berekent exacte doses met deze percentages en prijst elke dosis op basis van je echte chemievoorraad — automatisch, offline, aan de rand van het zwembad. Gratis voor maximaal 5 zwembaden."
  final_guide: "Lees de doseringsgids"
  faq:
    - question: "Hoeveel zoutzuur heb ik nodig om de pH te verlagen?"
      answer: "Voor standaard zoutzuur van 31,45% gebruik je ongeveer 26 vloeibare ounces per 0,2 pH-verlaging per 10.000 gallon. Deze calculator schaalt dat percentage automatisch naar je zwembadvolume en de grootte van de pH-daling. Voor een zwembad van 15.000 gallon dat de pH van 8,0 naar 7,4 verlaagt (een daling van 0,6) komt dat neer op ongeveer 117 fl oz, of ongeveer 0,9 gallon. Voeg zuur altijd toe aan water, nooit water aan zuur, en verdeel het met de pomp aan."
    - question: "Hoeveel natriumbicarbonaat verhoogt de alkaliniteit van het zwembad?"
      answer: "Natriumbicarbonaat verhoogt de totale alkaliniteit met ongeveer 24 ounces per 10 ppm stijging per 10.000 gallon. Voor een zwembad van 15.000 gallon dat van 60 naar 90 ppm gaat (een stijging van 30 ppm) is dat ongeveer 108 ounces, of ongeveer 6,75 pond. Natriumbicarbonaat heeft de voorkeur boven soda voor de alkaliniteit omdat het de pH nauwelijks beïnvloedt."
    - question: "In welke volgorde moet ik zwembadchemicaliën toevoegen?"
      answer: "Stel eerst de pH in, dan de totale alkaliniteit, dan de calciumhardheid. Zowel alkaliniteits- als calciumcorrecties kunnen de pH verschuiven, dus de pH eerst instellen vermindert het aantal hercorrecties. Circuleer het water en wacht tussen toevoegingen — ongeveer 15–20 minuten na zoutzuur, 20–30 na soda en 15 na calciumchloride — en meet opnieuw voordat je de volgende correctie toepast."
    - question: "Kan ik de totale alkaliniteit of calciumhardheid met een chemisch middel verlagen?"
      answer: "Niet rechtstreeks. De totale alkaliniteit verlagen vereist het toevoegen van zoutzuur om zowel de pH als de TA te laten dalen, en daarna beluchten om de pH weer te laten stijgen zonder de alkaliniteit te verhogen — vaak een herhaalde cyclus, geen enkele dosis. Calciumhardheid kan alleen worden verlaagd door gedeeltelijk af te tappen en bij te vullen met water met een lagere hardheid. Deze calculator markeert beide gevallen in plaats van een dosis te geven."
    - question: "Hoe nauwkeurig is deze doseringscalculator?"
      answer: "Hij gebruikt dezelfde brancheconforme percentages als een professionele doseermotor, geschaald naar je volume. Werkelijke resultaten variëren met de chemieconcentratie, watertemperatuur en testnauwkeurigheid, dus meet altijd opnieuw na een circulatiecyclus voordat je meer toevoegt. Beschouw de doses als een sterk startpunt, niet als vervanging van een betrouwbare testset."
