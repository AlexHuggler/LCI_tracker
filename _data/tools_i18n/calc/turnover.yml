pt:
  title: "Calculadora de tempo de bomba e renovação — horas diárias e tempo de renovação"
  description: "Calculadora gratuita de tempo de bomba para piscina. Informe o volume da sua piscina e a vazão da bomba para descobrir o tempo de renovação e quantas horas por dia ligar a bomba para uma circulação adequada."
  h1: "Calculadora de tempo de bomba"
  subtitle: "Descubra o tempo de renovação e quantas horas por dia ligar a bomba para uma circulação adequada — a partir do volume da sua piscina e da vazão da bomba."
  inputs_heading: "Sua piscina e bomba"
  label_volume: "Volume da piscina"
  volume_unit_aria: "Unidade de volume: galões. Toque para mudar para litros."
  volume_help_prefix: "Não tem certeza?"
  volume_help_link: "Use a calculadora de volume &rarr;"
  label_flow: "Vazão da bomba"
  flow_help: "Bombas residenciais típicas funcionam entre 40 e 80 GPM."
  label_turnovers: "Renovações por dia"
  turnovers_help: "Uma renovação por dia é o mínimo comum; duas é um objetivo típico."
  result_label: "Tempo de funcionamento diário"
  result_unit: "horas / dia"
  bd_turnover: "Uma renovação completa"
  bd_perday: "Água movida por dia"
  cta_app: "Registre o equipamento por piscina no app"
  disclaimer: "Apenas para orientação. A vazão real cai à medida que os filtros carregam e varia com o encanamento e a pressão — leia um medidor de vazão quando puder. Bombas de velocidade variável movem a mesma água por mais horas e de forma mais econômica."
  how_heading: "Como funcionam a renovação e o tempo de bomba"
  how_body: >-
    <p>O <strong>tempo de renovação</strong> é quanto a bomba leva para empurrar pelo filtro
    um volume de água equivalente a toda a piscina:</p>
    <p class="text-center font-semibold text-pool-dark">Renovação (horas) = Volume ÷ (Vazão GPM × 60)</p>
    <p>Para renovar a água mais de uma vez por dia, multiplique pelo seu número-alvo de renovações:</p>
    <p class="text-center font-semibold text-pool-dark">Tempo diário = Renovações × Tempo de renovação</p>
    <p>Para uma piscina de 15.000 galões com uma bomba de 60 GPM, uma renovação leva 15.000 ÷ (60 × 60) ≈ <strong>4,2 horas</strong>.
    Mirar em duas renovações por dia significa ligá-la por cerca de <strong>8,3 horas</strong>.</p>
    <h3>Dicas práticas</h3>
    <ul>
    <li><strong>Ligue durante o dia.</strong> A luz solar aumenta a demanda de cloro, então circule quando a piscina precisa distribuir o sanitizante.</li>
    <li><strong>Considere filtros sujos.</strong> A vazão cai à medida que o filtro carrega — inclua margem ou meça a vazão diretamente.</li>
    <li><strong>Bombas de velocidade variável</strong> atingem a mesma renovação diária em velocidade mais baixa por mais horas, usando muito menos eletricidade.</li>
    </ul>
    <p>Precisa do seu volume primeiro? Use a <a href="/pool-volume-calculator/">calculadora de volume</a>.
    Uma boa circulação também ajuda os produtos da <a href="/chemical-dosing-calculator/">calculadora de dosagem</a> a se distribuírem de forma uniforme.</p>
  faq_heading: "Perguntas frequentes sobre tempo de bomba"
  final_title: "Otimize sua rota"
  final_body: "O PoolFlow mantém o equipamento, o volume e a química de cada piscina em um só lugar — para que cada visita esteja ajustada. Offline, à beira da piscina. Grátis para até 5 piscinas."
  final_guide: "Calcular o volume da piscina"
  faq:
    - question: "Quantas horas por dia devo ligar a bomba da piscina?"
      answer: "Ligue a bomba por tempo suficiente para renovar a água pelo menos uma vez por dia — muitos técnicos miram em uma a duas renovações. Tempo de renovação = volume da piscina ÷ (vazão em GPM × 60). Para uma piscina de 15.000 galões com uma bomba de 60 GPM, uma renovação leva cerca de 4,2 horas, então duas renovações significam cerca de 8,3 horas de funcionamento. Esta calculadora resolve isso a partir do seu volume e vazão."
    - question: "O que é o tempo de renovação da piscina?"
      answer: "O tempo de renovação é quanto a bomba leva para circular pelo filtro um volume de água igual ao da piscina inteira. É calculado como volume ÷ (vazão × 60 minutos). Uma renovação mais curta significa filtração mais rápida e melhor distribuição dos produtos químicos. A maioria das piscinas residenciais é projetada para uma renovação de 8 horas ou menos."
    - question: "Como descubro a vazão da minha bomba?"
      answer: "A vazão (em galões por minuto) depende da potência da bomba, do tamanho do encanamento e da resistência do sistema. A forma mais precisa é lê-la em um medidor de vazão na linha de retorno, ou estimá-la pela curva da bomba no manual na altura manométrica total do seu sistema. As vazões residenciais típicas ficam entre 40 e 80 GPM."
    - question: "É melhor ligar a bomba da piscina de dia ou de noite?"
      answer: "Ligue pelo menos parte do ciclo durante o dia, quando a luz solar aumenta a demanda de cloro e o crescimento de algas — circular então mantém o sanitizante distribuído quando a piscina mais precisa. Muitos técnicos dividem o tempo de funcionamento ou usam uma bomba de velocidade variável por mais tempo em baixa velocidade, que move a mesma água de forma mais eficiente e barata. O objetivo total de renovação diária permanece o mesmo."
    - question: "Ligar a bomba por mais tempo gasta mais produtos químicos?"
      answer: "Não — a circulação em si não consome sanitizante, e uma boa renovação na verdade ajuda os produtos químicos a agir de forma eficiente, distribuindo-os uniformemente e empurrando a água pelo filtro. O principal custo de um tempo de funcionamento maior é a eletricidade, e é aí que as bombas de velocidade variável economizam dinheiro ao mover a água lentamente por mais horas."
  js:
    hrs: "h"
    per_turnover: "h/renovação"
    per_day: "h/dia"
    vol_unit_gal_aria: "Unidade de volume: galões. Toque para mudar."
    vol_unit_l_aria: "Unidade de volume: litros. Toque para mudar."

nl:
  title: "Pomplooptijd- & circulatierekenmachine — uren per dag en circulatietijd"
  description: "Gratis pomplooptijd-calculator voor het zwembad. Voer je zwembadvolume en de pompcapaciteit in om je circulatietijd te vinden en hoeveel uur per dag je de pomp moet laten draaien voor een goede circulatie."
  h1: "Pomplooptijd-calculator"
  subtitle: "Bereken je circulatietijd en hoeveel uur per dag je de pomp moet laten draaien voor een goede circulatie — op basis van je zwembadvolume en de pompcapaciteit."
  inputs_heading: "Je zwembad & pomp"
  label_volume: "Zwembadvolume"
  volume_unit_aria: "Volume-eenheid: gallons. Tik om naar liters te schakelen."
  volume_help_prefix: "Niet zeker?"
  volume_help_link: "Gebruik de volumecalculator &rarr;"
  label_flow: "Pompcapaciteit"
  flow_help: "Typische zwembadpompen voor thuis draaien 40–80 GPM."
  label_turnovers: "Circulaties per dag"
  turnovers_help: "Eén circulatie per dag is het gangbare minimum; twee is een typisch doel."
  result_label: "Dagelijkse looptijd"
  result_unit: "uur / dag"
  bd_turnover: "Eén volledige circulatie"
  bd_perday: "Verplaatst water per dag"
  cta_app: "Leg apparatuur per zwembad vast in de app"
  disclaimer: "Alleen ter indicatie. De werkelijke capaciteit daalt naarmate filters vollopen en varieert met leidingwerk en opvoerhoogte — lees een doorstroommeter af wanneer dat kan. Pompen met variabele snelheid verplaatsen hetzelfde water over langere, goedkopere uren."
  how_heading: "Hoe circulatie & looptijd werken"
  how_body: >-
    <p>De <strong>circulatietijd</strong> is hoe lang de pomp erover doet om een hoeveelheid water
    gelijk aan het hele zwembad door het filter te duwen:</p>
    <p class="text-center font-semibold text-pool-dark">Circulatie (uren) = Volume ÷ (Capaciteit GPM × 60)</p>
    <p>Om het water meer dan eens per dag te circuleren, vermenigvuldig je met je beoogde aantal circulaties:</p>
    <p class="text-center font-semibold text-pool-dark">Dagelijkse looptijd = Circulaties × Circulatietijd</p>
    <p>Voor een zwembad van 15.000 gallons met een pomp van 60 GPM duurt één circulatie 15.000 ÷ (60 × 60) ≈ <strong>4,2 uur</strong>.
    Mikken op twee circulaties per dag betekent ongeveer <strong>8,3 uur</strong> draaien.</p>
    <h3>Praktische tips</h3>
    <ul>
    <li><strong>Laat draaien overdag.</strong> Zonlicht verhoogt de chloorbehoefte, dus circuleer wanneer het zwembad het ontsmettingsmiddel verdeeld nodig heeft.</li>
    <li><strong>Houd rekening met vuile filters.</strong> De capaciteit daalt naarmate het filter vollloopt — bouw marge in of meet de doorstroming rechtstreeks.</li>
    <li><strong>Pompen met variabele snelheid</strong> halen dezelfde dagelijkse circulatie op lagere snelheid over meer uren, met veel minder stroomverbruik.</li>
    </ul>
    <p>Eerst je volume nodig? Gebruik de <a href="/pool-volume-calculator/">zwembadvolume-calculator</a>.
    Een goede circulatie helpt ook de middelen uit de <a href="/chemical-dosing-calculator/">doseringscalculator</a> gelijkmatig te verdelen.</p>
  faq_heading: "Veelgestelde vragen over pomplooptijd"
  final_title: "Optimaliseer je route"
  final_body: "PoolFlow houdt de apparatuur, het volume en de chemie van elk zwembad op één plek — zodat elk bezoek goed is afgesteld. Offline, aan de rand van het zwembad. Gratis voor maximaal 5 zwembaden."
  final_guide: "Zwembadvolume berekenen"
  faq:
    - question: "Hoeveel uur per dag moet ik mijn zwembadpomp laten draaien?"
      answer: "Laat de pomp lang genoeg draaien om het water minstens één keer per dag te circuleren — veel techneuten mikken op één tot twee circulaties. Circulatietijd = zwembadvolume ÷ (capaciteit in GPM × 60). Voor een zwembad van 15.000 gallons met een pomp van 60 GPM duurt één circulatie ongeveer 4,2 uur, dus twee circulaties betekenen ongeveer 8,3 uur draaien. Deze calculator rekent dit uit op basis van je volume en capaciteit."
    - question: "Wat is de circulatietijd van een zwembad?"
      answer: "De circulatietijd is hoe lang de pomp erover doet om een hoeveelheid water gelijk aan het hele zwembad door het filter te laten stromen. Het wordt berekend als volume ÷ (capaciteit × 60 minuten). Een kortere circulatie betekent snellere filtratie en een betere verdeling van de chemicaliën. De meeste zwembaden voor thuis zijn ontworpen voor een circulatie van 8 uur of korter."
    - question: "Hoe vind ik de capaciteit van mijn pomp?"
      answer: "De capaciteit (in gallons per minuut) hangt af van het vermogen van de pomp, de grootte van het leidingwerk en de weerstand van het systeem. De nauwkeurigste manier is om die af te lezen op een doorstroommeter in de retourleiding, of te schatten aan de hand van de pompcurve in de handleiding bij de totale opvoerhoogte van je systeem. Typische capaciteiten voor thuis liggen tussen 40 en 80 GPM."
    - question: "Is het beter om de zwembadpomp overdag of 's nachts te laten draaien?"
      answer: "Laat minstens een deel van de cyclus overdag draaien, wanneer zonlicht de chloorbehoefte en algengroei verhoogt — dan circuleren houdt het ontsmettingsmiddel verdeeld wanneer het zwembad het het hardst nodig heeft. Veel techneuten verdelen de looptijd of gebruiken een pomp met variabele snelheid die langer op lage snelheid draait, wat hetzelfde water efficiënter en goedkoper verplaatst. Het totale dagelijkse circulatiedoel blijft hetzelfde."
    - question: "Verbruikt langer pompen meer chemicaliën?"
      answer: "Nee — circulatie zelf verbruikt geen ontsmettingsmiddel, en een goede circulatie helpt de chemicaliën juist efficiënt te werken door ze gelijkmatig te verdelen en het water door het filter te duwen. De belangrijkste kostenpost van langere looptijd is elektriciteit, en daar besparen pompen met variabele snelheid geld door het water langzaam over meer uren te verplaatsen."
  js:
    hrs: "u"
    per_turnover: "u/circulatie"
    per_day: "u/dag"
    vol_unit_gal_aria: "Volume-eenheid: gallons. Tik om te wisselen."
    vol_unit_l_aria: "Volume-eenheid: liters. Tik om te wisselen."
