blurbs:
  lsi: "Langelier-verzadigingsindex in realtime, met CYA-gecorrigeerde alkaliniteit — is je water corrosief, in balans of kalkafzettend?"
  volume: "Schat de gallons (of liters) voor rechthoekige, ronde, ovale en vrije vormen — het startpunt voor elke dosis."
