features:
  - title: "Calculadora LSI em Tempo Real"
    description: "\u00CDndice de Satura\u00E7\u00E3o de Langelier instant\u00E2neo com corre\u00E7\u00E3o de alcalinidade CYA. Observe o LSI animar enquanto voc\u00EA ajusta suas leituras."
