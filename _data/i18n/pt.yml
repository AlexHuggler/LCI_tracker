# HowTo schema \u2014 LSI calculation tutorial for LLM/answer-engine optimization
howto_lsi:
  name: "Como calcular o LSI (\u00CDndice de Satura\u00E7\u00E3o de Langelier) de uma piscina"
  description: "C\u00E1lculo passo a passo do LSI com corre\u00E7\u00E3o CYA usando o PoolFlow."
  steps:
    - name: "Me\u00E7a os par\u00E2metros da \u00E1gua"
      text: "Me\u00E7a pH, alcalinidade total, dureza c\u00E1lcica, temperatura, TDS e CYA com um kit de teste."
    - name: "Insira as leituras no PoolFlow"
      text: "Abra o PoolFlow e insira cada leitura. O app aplica a corre\u00E7\u00E3o CYA automaticamente."
    - name: "Leia o resultado do LSI"
      text: "O PoolFlow mostra o LSI com c\u00F3digo de cores: corrosivo, equilibrado ou incrustante."
    - name: "Aplique as doses recomendadas"
      text: "Siga as recomenda\u00E7\u00F5es qu\u00EDmicas para trazer o LSI para a faixa -0,3 a +0,3."
