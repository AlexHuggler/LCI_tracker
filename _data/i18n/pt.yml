features_title: "Tudo Que Voc\u00EA Precisa na Beira da Piscina"
features_subtitle: "PoolFlow substitui registros em papel, c\u00E1lculos manuais e planilhas por um aplicativo poderoso."
features:
  - title: "Calculadora LSI em Tempo Real"
    description: "\u00CDndice de Satura\u00E7\u00E3o de Langelier instant\u00E2neo com corre\u00E7\u00E3o de alcalinidade CYA. Observe o LSI animar enquanto voc\u00EA ajusta suas leituras."
    icon: "calculator"
  - title: "Dosagem Qu\u00EDmica Inteligente"
    description: "Recomenda\u00E7\u00F5es exatas baseadas no seu invent\u00E1rio e custos reais. Sem mais adivinha\u00E7\u00F5es."
    icon: "beaker"
  - title: "Otimiza\u00E7\u00E3o de Rotas"
    description: "Economize horas toda semana com algoritmos de rota otimizada nearest-neighbor e 2-opt."
    icon: "route"
  - title: "An\u00E1lise de Lucratividade"
    description: "Identifique quais piscinas geram dinheiro e quais custam. Rastreamento de receita por visita."
    icon: "chart"

faq_title: "Perguntas Frequentes"
faq:
  - question: "O PoolFlow funciona sem internet?"
    answer: "Sim. O PoolFlow funciona completamente offline. Todos os dados s\u00E3o armazenados localmente no seu iPhone e sincronizados via iCloud quando uma conex\u00E3o est\u00E1 dispon\u00EDvel."
  - question: "Quais idiomas o PoolFlow suporta?"
    answer: "O PoolFlow est\u00E1 dispon\u00EDvel em portugu\u00EAs, ingl\u00EAs, espanhol, franc\u00EAs, alem\u00E3o e holand\u00EAs."
  - question: "Quanto custa o PoolFlow?"
    answer: "O PoolFlow \u00E9 gratuito para at\u00E9 5 piscinas. O plano Pro custa US$ 29,99/m\u00EAs ou US$ 299,99/ano com 7 dias de teste gr\u00E1tis."
  - question: "O que \u00E9 o \u00CDndice de Satura\u00E7\u00E3o de Langelier (LSI)?"
    answer: "O LSI \u00E9 uma f\u00F3rmula que prev\u00EA se a \u00E1gua da piscina \u00E9 corrosiva ou incrustante. O PoolFlow calcula automaticamente com corre\u00E7\u00E3o CYA para resultados precisos."

