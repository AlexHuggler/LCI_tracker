features_title: "Alles Wat Je Nodig Hebt Aan De Rand Van Het Zwembad"
features_subtitle: "PoolFlow vervangt papieren logboeken, handmatige berekeningen en spreadsheets door \u00E9\u00E9n krachtige app."
features:
  - title: "Realtime LSI-Calculator"
    description: "Directe Langelier Saturatie Index met CYA-gecorrigeerde alkaliteit. Bekijk de LSI-animatie terwijl je je metingen aanpast."
    icon: "calculator"
  - title: "Slimme Chemische Dosering"
    description: "Exacte aanbevelingen op basis van je inventaris en werkelijke kosten. Geen giswerk meer."
    icon: "beaker"
  - title: "Route-optimalisatie"
    description: "Bespaar elke week uren met geoptimaliseerde nearest-neighbor en 2-opt routealgoritmen."
    icon: "route"
  - title: "Winstanalyse"
    description: "Ontdek welke zwembaden geld opleveren en welke je geld kosten. Omzet per bezoek bijhouden."
    icon: "chart"

faq_title: "Veelgestelde Vragen"
faq:
  - question: "Werkt PoolFlow zonder internet?"
    answer: "Ja. PoolFlow werkt volledig offline. Alle gegevens worden lokaal opgeslagen op je iPhone en gesynchroniseerd via iCloud wanneer er een verbinding beschikbaar is."
  - question: "Welke talen ondersteunt PoolFlow?"
    answer: "PoolFlow is beschikbaar in het Nederlands, Engels, Spaans, Frans, Portugees en Duits."
  - question: "Hoeveel kost PoolFlow?"
    answer: "PoolFlow is gratis voor maximaal 5 zwembaden. De App Store toont de actuele prijs en proefperiode voordat je een Pro-abonnement bevestigt."
  - question: "Wat is de Langelier Saturatie Index (LSI)?"
    answer: "De LSI is een formule die voorspelt of het zwembadwater corrosief of kalkvormend is. PoolFlow berekent het automatisch met CYA-correctie voor nauwkeurige resultaten."

