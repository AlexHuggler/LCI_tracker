# HowTo schema — LSI calculation tutorial for LLM/answer-engine optimization
howto_lsi:
  name: "Hoe de LSI (Langelier Saturatie Index) van een zwembad berekenen"
  description: "Stap-voor-stap LSI-berekening met CYA-correctie met behulp van PoolFlow."
  steps:
    - name: "Meet de waterparameters"
      text: "Meet pH, totale alkaliteit, calciumhardheid, temperatuur, TDS en CYA met een testkit."
    - name: "Voer de metingen in PoolFlow in"
      text: "Open PoolFlow en voer elke meting in. De app past de CYA-correctie automatisch toe."
    - name: "Lees het LSI-resultaat af"
      text: "PoolFlow toont de kleurgecodeerde LSI: corrosief, in balans of kalkvormend."
    - name: "Pas de aanbevolen doseringen toe"
      text: "Volg de chemische aanbevelingen om de LSI in het bereik -0,3 tot +0,3 te brengen."

