# HowTo schema \u2014 LSI calculation tutorial for LLM/answer-engine optimization
howto_lsi:
  name: "C\u00F3mo calcular el LSI (\u00CDndice de Saturaci\u00F3n de Langelier) de una piscina"
  description: "C\u00E1lculo paso a paso del LSI con correcci\u00F3n por CYA usando PoolFlow."
  steps:
    - name: "Mide los par\u00E1metros del agua"
      text: "Mide pH, alcalinidad total, dureza c\u00E1lcica, temperatura, TDS y CYA con un kit de prueba."
    - name: "Ingresa las lecturas en PoolFlow"
      text: "Abre PoolFlow e ingresa cada lectura. La app aplica correcci\u00F3n por CYA autom\u00E1ticamente."
    - name: "Lee el resultado del LSI"
      text: "PoolFlow muestra el LSI con c\u00F3digo de color: corrosivo, equilibrado o incrustante."
    - name: "Aplica las dosis recomendadas"
      text: "Sigue las recomendaciones de qu\u00EDmicos para llevar el LSI al rango -0.3 a +0.3."
