faq_title: "Preguntas Frecuentes"
faq:
  - question: "\u00BFFunciona PoolFlow sin internet?"
    answer: "S\u00ED. PoolFlow funciona completamente sin conexi\u00F3n. Todos los datos se almacenan localmente en tu iPhone y se sincronizan con iCloud cuando hay conexi\u00F3n disponible."
  - question: "\u00BFQu\u00E9 idiomas soporta PoolFlow?"
    answer: "PoolFlow est\u00E1 disponible en espa\u00F1ol, ingl\u00E9s, franc\u00E9s, portugu\u00E9s, alem\u00E1n y neerland\u00E9s."
  - question: "\u00BFCu\u00E1nto cuesta PoolFlow?"
    answer: "PoolFlow es gratis para hasta 5 piscinas. El plan Pro cuesta $29.99 USD/mes o $299.99 USD/a\u00F1o con una prueba gratuita de 7 d\u00EDas."
  - question: "\u00BFQu\u00E9 es el \u00CDndice de Saturaci\u00F3n de Langelier (LSI)?"
    answer: "El LSI es una f\u00F3rmula que predice si el agua de la piscina es corrosiva o incrustante. PoolFlow lo calcula autom\u00E1ticamente con correcci\u00F3n de CYA para resultados precisos."

