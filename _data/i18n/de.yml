# HowTo schema \u2014 LSI calculation tutorial for LLM/answer-engine optimization
howto_lsi:
  name: "Wie man den LSI (Langelier-S\u00E4ttigungsindex) eines Pools berechnet"
  description: "Schritt-f\u00FCr-Schritt LSI-Berechnung mit CYA-Korrektur mit PoolFlow."
  steps:
    - name: "Wasserparameter messen"
      text: "Messe pH, Gesamtalkalit\u00E4t, Kalziumh\u00E4rte, Temperatur, TDS und CYA mit einem Testkit."
    - name: "Messwerte in PoolFlow eingeben"
      text: "\u00D6ffne PoolFlow und gib jeden Messwert ein. Die App wendet die CYA-Korrektur automatisch an."
    - name: "LSI-Ergebnis ablesen"
      text: "PoolFlow zeigt den farblich kodierten LSI an: korrosiv, ausgeglichen oder kalkbildend."
    - name: "Empfohlene Dosierungen anwenden"
      text: "Folge den chemischen Empfehlungen, um den LSI in den Bereich -0,3 bis +0,3 zu bringen."

