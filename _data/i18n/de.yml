faq_title: "H\u00E4ufig Gestellte Fragen"
faq:
  - question: "Funktioniert PoolFlow ohne Internet?"
    answer: "Ja. PoolFlow funktioniert vollst\u00E4ndig offline. Alle Daten werden lokal auf deinem iPhone gespeichert und \u00FCber iCloud synchronisiert, wenn eine Verbindung verf\u00FCgbar ist."
  - question: "Welche Sprachen unterst\u00FCtzt PoolFlow?"
    answer: "PoolFlow ist auf Deutsch, Englisch, Spanisch, Franz\u00F6sisch, Portugiesisch und Niederl\u00E4ndisch verf\u00FCgbar."
  - question: "Was kostet PoolFlow?"
    answer: "PoolFlow ist kostenlos f\u00FCr bis zu 5 Pools. Der Pro-Plan kostet 29,99 $ USD/Monat oder 299,99 $ USD/Jahr mit einer 7-t\u00E4gigen kostenlosen Testphase."
  - question: "Was ist der Langelier-S\u00E4ttigungsindex (LSI)?"
    answer: "Der LSI ist eine Formel, die vorhersagt, ob das Poolwasser korrosiv oder kalkbildend ist. PoolFlow berechnet ihn automatisch mit CYA-Korrektur f\u00FCr pr\u00E4zise Ergebnisse."

