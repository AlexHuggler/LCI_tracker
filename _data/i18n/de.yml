features_title: "Alles Was Du Am Pool Brauchst"
features_subtitle: "PoolFlow ersetzt Papierlisten, manuelle Berechnungen und Tabellen durch eine leistungsstarke App."
features:
  - title: "Echtzeit-LSI-Rechner"
    description: "Sofortiger Langelier-S\u00E4ttigungsindex mit CYA-korrigierter Alkalit\u00E4t. Beobachte die LSI-Animation w\u00E4hrend du deine Messwerte anpasst."
    icon: "calculator"
  - title: "Intelligente Chemische Dosierung"
    description: "Exakte Empfehlungen basierend auf deinem Inventar und tats\u00E4chlichen Kosten. Kein Raten mehr."
    icon: "beaker"
  - title: "Routenoptimierung"
    description: "Spare jede Woche Stunden mit optimierten Nearest-Neighbor- und 2-opt-Routenalgorithmen."
    icon: "route"
  - title: "Gewinnanalyse"
    description: "Erkenne welche Pools Geld bringen und welche dich kosten. Umsatzverfolgung pro Besuch."
    icon: "chart"

faq_title: "H\u00E4ufig Gestellte Fragen"
faq:
  - question: "Funktioniert PoolFlow ohne Internet?"
    answer: "Ja. PoolFlow funktioniert vollst\u00E4ndig offline. Alle Daten werden lokal auf deinem iPhone gespeichert und \u00FCber iCloud synchronisiert, wenn eine Verbindung verf\u00FCgbar ist."
  - question: "Welche Sprachen unterst\u00FCtzt PoolFlow?"
    answer: "PoolFlow ist auf Deutsch, Englisch, Spanisch, Franz\u00F6sisch, Portugiesisch und Niederl\u00E4ndisch verf\u00FCgbar."
  - question: "Was kostet PoolFlow?"
    answer: "PoolFlow ist für bis zu 5 Pools kostenlos. Der App Store zeigt Preis und Testangebot für Pro vor der Bestätigung an."
  - question: "Was ist der Langelier-S\u00E4ttigungsindex (LSI)?"
    answer: "Der LSI ist eine Formel, die vorhersagt, ob das Poolwasser korrosiv oder kalkbildend ist. PoolFlow berechnet ihn automatisch mit CYA-Korrektur f\u00FCr pr\u00E4zise Ergebnisse."

