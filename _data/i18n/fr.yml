faq_title: "Questions Fr\u00E9quentes"
faq:
  - question: "PoolFlow fonctionne-t-il sans internet ?"
    answer: "Oui. PoolFlow fonctionne enti\u00E8rement hors ligne. Toutes les donn\u00E9es sont stock\u00E9es localement sur votre iPhone et synchronis\u00E9es via iCloud lorsqu'une connexion est disponible."
  - question: "Quelles langues PoolFlow prend-il en charge ?"
    answer: "PoolFlow est disponible en fran\u00E7ais, anglais, espagnol, portugais, allemand et n\u00E9erlandais."
  - question: "Combien co\u00FBte PoolFlow ?"
    answer: "PoolFlow est gratuit pour jusqu'\u00E0 5 piscines. Le plan Pro co\u00FBte 29,99 $ USD/mois ou 299,99 $ USD/an avec un essai gratuit de 7 jours."
  - question: "Qu'est-ce que l'Indice de Saturation de Langelier (LSI) ?"
    answer: "Le LSI est une formule qui pr\u00E9dit si l'eau de la piscine est corrosive ou entartrante. PoolFlow le calcule automatiquement avec correction CYA pour des r\u00E9sultats pr\u00E9cis."

