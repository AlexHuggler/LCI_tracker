# HowTo schema \u2014 LSI calculation tutorial for LLM/answer-engine optimization
howto_lsi:
  name: "Comment calculer le LSI (Indice de Saturation de Langelier) d'une piscine"
  description: "Calcul \u00E9tape par \u00E9tape du LSI avec correction CYA en utilisant PoolFlow."
  steps:
    - name: "Mesurez les param\u00E8tres de l'eau"
      text: "Mesurez le pH, l'alcalinit\u00E9 totale, la duret\u00E9 calcique, la temp\u00E9rature, le TDS et le CYA avec un kit de test."
    - name: "Saisissez les mesures dans PoolFlow"
      text: "Ouvrez PoolFlow et saisissez chaque mesure. L'application applique automatiquement la correction CYA."
    - name: "Lisez le r\u00E9sultat du LSI"
      text: "PoolFlow affiche le LSI avec code couleur : corrosif, \u00E9quilibr\u00E9 ou entartrant."
    - name: "Appliquez les dosages recommand\u00E9s"
      text: "Suivez les recommandations chimiques pour ramener le LSI dans la plage -0.3 \u00E0 +0.3."

